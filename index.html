<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ElectroPOS · Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
:root{
  --bg:#050a14;--bg2:#0a1524;--bg3:#101d33;--bg4:#182a47;
  --border:rgba(59,130,246,.14);--border2:rgba(59,130,246,.32);
  --accent:#3b82f6;--accent2:#2563eb;--accentB:#60a5fa;--accentS:rgba(59,130,246,.14);--glow:rgba(59,130,246,.5);
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
  --text:#fff;--text2:#a8b8d0;--text3:#64748b;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
input,button,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{-webkit-appearance:none;appearance:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

/* LOADING / FATAL / LOGIN */
.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);z-index:9999}
.spinner{width:52px;height:52px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.fatal{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.fatal-card{max-width:480px;width:100%;background:var(--bg2);border:1px solid rgba(239,68,68,.4);border-radius:var(--r-xl);padding:28px 22px}
.fatal-card h2{font-size:1.2rem;font-weight:800;margin-bottom:10px;color:var(--danger)}
.fatal-card p{color:var(--text2);font-size:.9rem;margin-bottom:14px;line-height:1.6}
.fatal-card pre{background:var(--bg3);border-radius:var(--r-sm);padding:12px;color:var(--warning);font-size:.78rem;overflow:auto;white-space:pre-wrap;max-height:220px;font-family:monospace;margin-bottom:14px}
.fatal-card button{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--r-md);font-weight:700;font-size:1rem}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,rgba(59,130,246,.15),transparent 50%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xl);padding:32px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.login-icon{width:68px;height:68px;margin:0 auto 4px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.login-card h1{text-align:center;font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--accentB));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-card .sub{text-align:center;color:var(--text3);font-size:.7rem;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-top:-8px}
.login-err{color:var(--danger);font-size:.82rem;text-align:center;min-height:18px;font-weight:600}
.google-btn{width:100%;padding:15px;background:#fff;color:#1f1f1f;border-radius:var(--r-md);font-size:.98rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px}
.google-btn:active{transform:scale(.97)}
.google-btn:disabled{opacity:.6}
.google-btn svg{width:20px;height:20px}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--safe-top)) 12px 8px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.hdr-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
.hdr-title h1{font-size:.98rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title span{font-size:.6rem;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.user-chip{display:flex;align-items:center;gap:6px;background:var(--bg3);padding:4px 10px 4px 4px;border-radius:100px;border:1px solid var(--border);height:42px;cursor:pointer}
.user-chip:active{background:var(--bg4);transform:scale(.97)}
.user-avatar{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--purple));display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:#fff;flex-shrink:0;overflow:hidden}
.user-avatar img{width:100%;height:100%;object-fit:cover}
.user-chip span{font-size:.75rem;font-weight:700;color:var(--text2);max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:400px){.user-chip span{display:none}.user-chip{padding:5px;width:42px;justify-content:center}}

/* MAIN LAYOUT */
.main{flex:1;display:flex;overflow:hidden;min-height:0}

/* PRODUCTS PANEL */
.products{flex:1.6;display:flex;flex-direction:column;padding:10px;overflow:hidden;min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{position:relative;flex:1;min-width:0}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem;pointer-events:none}
.search input{width:100%;padding:13px 40px 13px 38px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.92rem;outline:none;min-height:48px;font-weight:500}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS)}
.search input::placeholder{color:var(--text3)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--bg4);color:var(--text2);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center}
.search.has-text .clear{display:flex}
.tbtn{width:48px;height:48px;min-width:48px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tbtn:active{transform:scale(.92)}
.tbtn.sec{background:var(--bg2);border:1.5px solid var(--border);color:var(--text2)}
.tbtn.sec.active{background:var(--warning);color:#000;border-color:var(--warning)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:100px;color:var(--text2);font-size:.8rem;font-weight:700;white-space:nowrap;min-height:38px;display:flex;align-items:center}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.94)}

.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding:2px 2px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.grid::-webkit-scrollbar{width:4px}
.grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}}

.card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;user-select:none;transition:transform .12s;position:relative;min-height:135px;justify-content:center}
.card:active{transform:scale(.95);background:var(--bg3);border-color:var(--accent)}
.card.oos{opacity:.4}
.card.fav::after{content:'\f005';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:8px;left:8px;color:var(--warning);font-size:.9rem}
.card-icon{width:50px;height:50px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent);margin-bottom:8px}
.card:active .card-icon{background:var(--accent);color:#fff}
.card-name{font-size:.8rem;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:32px;display:flex;align-items:center;justify-content:center}
.card-price{font-size:1rem;font-weight:900;color:var(--accentB);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.card-stock{font-size:.66rem;color:var(--text3);margin-top:4px;font-weight:700}
.card-stock.low{color:var(--warning)}
.card-stock.out{color:var(--danger)}
.card-badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:900;min-width:22px;text-align:center}
.card-menu{position:absolute;bottom:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:.75rem;padding:0;opacity:.75}
.card-menu:active{background:var(--accent);color:#fff;transform:scale(.9)}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:3rem;opacity:.2;margin-bottom:14px;display:block}

/* CART */
.cart{flex:1;min-width:340px;max-width:440px;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--border)}
.cart-hdr{padding:14px 16px;background:var(--bg3);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.cart-hdr h3{font-size:.98rem;font-weight:800;display:flex;align-items:center;gap:8px}
.cart-hdr h3 i{color:var(--accentB)}
.cart-hdr .count{background:var(--accent);color:#fff;padding:2px 10px;border-radius:100px;font-size:.72rem;font-weight:900}

.cart-items{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.cart-items::-webkit-scrollbar{width:4px}
.cart-items::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px;padding:30px 20px;text-align:center}
.cart-empty i{font-size:2.8rem;opacity:.2}

.c-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px}
.c-icon{width:40px;height:40px;border-radius:10px;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:.95rem;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-info h4{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.c-info p{font-size:.72rem;color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums}
.c-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.qbtn{width:32px;height:32px;border-radius:9px;background:var(--bg4);color:var(--text);font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.qbtn:active{background:var(--accent);color:#fff;transform:scale(.88)}
.qval{min-width:24px;text-align:center;font-size:.85rem;font-weight:900;font-variant-numeric:tabular-nums}
.del-btn{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--danger);font-size:.88rem;display:flex;align-items:center;justify-content:center;padding:0;margin-left:2px}
.del-btn:active{background:var(--danger);color:#fff;transform:scale(.9)}

.cart-foot{padding:12px 12px calc(12px + var(--safe-bottom));border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.summary{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2);font-weight:600}
.sumrow.total{font-size:1.2rem;font-weight:900;padding-top:10px;border-top:1px dashed var(--border);margin-top:5px}
.sumrow.total span:last-child{color:var(--accentB);font-variant-numeric:tabular-nums}
.c-actions-row{display:flex;gap:8px}
.act-btn{flex:1;padding:14px 8px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text2);font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.act-btn:active{transform:scale(.96)}
.act-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:900}
.act-btn:disabled{opacity:.5}

/* MODAL */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.m-content{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;max-height:94dvh;transform:translateY(24px);transition:transform .25s;padding-bottom:var(--safe-bottom)}
.modal.open .m-content{transform:translateY(0)}
.m-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);background:var(--bg3);border-radius:var(--r-xl) var(--r-xl) 0 0;position:relative}
.m-hdr::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:4px;background:var(--border2);border-radius:4px}
.m-hdr h3{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:8px}
.m-hdr h3 i{color:var(--accentB)}
.m-close{width:38px;height:38px;border-radius:50%;background:var(--bg4);color:var(--text2);font-size:1rem;display:flex;align-items:center;justify-content:center;margin-top:8px;padding:0}
.m-close:active{background:rgba(239,68,68,.2);color:var(--danger)}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.m-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg3)}
.m-foot button{flex:1;padding:15px;border-radius:var(--r-md);font-size:.92rem;font-weight:800;min-height:48px}
.m-foot button:active{transform:scale(.97)}

.bp{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bs{background:var(--bg4);color:var(--text2);border:1.5px solid var(--border)}
.bd{background:rgba(239,68,68,.15);color:var(--danger);border:1.5px solid rgba(239,68,68,.35)}
.bok{background:linear-gradient(135deg,var(--success),#059669);color:#fff;font-weight:900}
.bok:disabled{opacity:.5}

.form-field{position:relative;margin-top:6px}
.form-field label{position:absolute;top:-8px;left:12px;background:var(--bg2);padding:0 6px;font-size:.66rem;color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.form-field input,.form-field select{padding:14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.98rem;outline:none;width:100%;min-height:48px;font-weight:600}
.form-field input:focus,.form-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS)}

.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pay-opt{padding:16px 8px;background:var(--bg3);border:2px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:8px;min-height:78px;justify-content:center}
.pay-opt.active{border-color:var(--accent);background:var(--accentS)}
.pay-opt i{font-size:1.5rem;color:var(--text2)}
.pay-opt.active i{color:var(--accentB)}
.pay-opt span{font-size:.78rem;font-weight:800;color:var(--text2)}
.pay-opt.active span{color:var(--accentB)}

.cash-box{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px}
.cash-amt{text-align:center;padding:12px;background:var(--bg4);border-radius:var(--r-md);margin-bottom:10px}
.cash-amt span{display:block;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:4px}
.cash-amt strong{font-size:1.7rem;font-weight:900;color:var(--accentB);font-variant-numeric:tabular-nums}
.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.quick-cash button{padding:11px 4px;background:var(--bg4);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-weight:800;font-size:.78rem;min-height:42px}
.quick-cash button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.change-disp{text-align:center;padding:14px;background:var(--bg4);border-radius:var(--r-md);margin-top:10px}
.change-disp span{display:block;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:5px}
.change-disp strong{font-size:1.7rem;font-weight:900;color:var(--success);font-variant-numeric:tabular-nums}
.change-disp.neg strong{color:var(--danger)}
.change-disp.neg{background:rgba(239,68,68,.1)}

.scan-view{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:var(--r-lg);overflow:hidden;border:2px solid var(--accent)}
.scan-view video{width:100%;height:100%;object-fit:cover}
.scan-overlay{position:absolute;inset:0;pointer-events:none}
.scan-overlay::before{content:'';position:absolute;left:15%;right:15%;height:2px;background:var(--accentB);animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:30%;opacity:.3}50%{top:70%;opacity:1}}
.scan-corner{position:absolute;width:70%;height:50%;top:25%;left:15%;border:2px solid var(--accentB);border-radius:14px}
.scan-status{text-align:center;color:var(--text2);font-size:.88rem;font-weight:700;padding:8px;min-height:24px}
.scan-status.ok{color:var(--success)}
.scan-manual{display:flex;gap:8px}
.scan-manual input{flex:1;padding:13px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.92rem;outline:none;font-family:monospace;min-height:46px}
.scan-manual button{padding:13px 18px;background:var(--accent);color:#fff;border-radius:var(--r-md);font-weight:800;font-size:.84rem;min-height:46px}

.receipt{background:#fff;color:#000;padding:20px 16px;border-radius:var(--r-md);font-family:monospace;font-size:.78rem;line-height:1.55}
.receipt h2{text-align:center;font-size:1.05rem;margin-bottom:4px;font-weight:800}
.receipt .center{text-align:center}
.receipt .div{border-top:1px dashed #000;margin:10px 0}
.receipt .row{display:flex;justify-content:space-between;font-weight:600}
.receipt .row.hdr{font-weight:800;text-transform:uppercase;font-size:.7rem}
.receipt .row.total{font-weight:800;font-size:.98rem;margin-top:6px;padding-top:6px;border-top:2px solid #000}

/* MENU / ACTION CARDS */
.action-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.action-card{padding:18px 12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.action-card:active{transform:scale(.96);background:var(--bg4);border-color:var(--accent)}
.action-card i{font-size:1.5rem;color:var(--accentB);margin-bottom:4px}
.action-card .t{font-size:.82rem;font-weight:800}
.action-card .s{font-size:.68rem;color:var(--text3);font-weight:600}
.action-card.danger i{color:var(--danger)}

/* ============================================================
   HELPERS
   ============================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(n){
  const num = Number(n) || 0;
  const fixed = num.toFixed(2);
  const parts = fixed.split('.');
  return 'KSh ' + parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + parts[1];
}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function iconFor(cat){return {phones:'fa-mobile-alt',laptops:'fa-laptop',audio:'fa-headphones',accessories:'fa-plug'}[cat]||'fa-box';}
function vibrate(p){if('vibrate' in navigator){try{navigator.vibrate(p);}catch(e){}}}

function toast(msg, type='info', duration=2400, showUndo=false){
  let c = document.querySelector('.toasts');
  if (!c) { c = document.createElement('div'); c.className = 'toasts'; document.body.appendChild(c); }
  const icons = {info:'fa-circle-info',success:'fa-circle-check',error:'fa-circle-xmark',warning:'fa-triangle-exclamation'};
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${esc(msg)}</span>${showUndo?'<button class="undo">Undo</button>':''}`;
  c.appendChild(el);
  if (showUndo) el.querySelector('.undo').onclick = () => { undoRemove(); el.remove(); };
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-20px)';
    el.style.transition = '.3s';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ============================================================
   CART MATH
   ============================================================ */
function cartSubtotal() { return cart.reduce((s,i) => s + i.price * i.qty, 0); }
function cartTax() { return cartSubtotal() * VAT_RATE; }
function cartTotal() { return cartSubtotal() + cartTax(); }
function cartCount() { return cart.reduce((s,i) => s + i.qty, 0); }

function saveCart() {
  try {
    const clean = cart.map(i => ({
      id: String(i.id),
      name: String(i.name),
      price: Number(i.price) || 0,
      icon: String(i.icon || 'fa-box'),
      qty: Math.max(1, parseInt(i.qty) || 1)
    }));
    localStorage.setItem(CART_KEY, JSON.stringify(clean));
  } catch (e) {}
}
function loadCart() {
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw) || [];
    // Sanitize every item — drop anything invalid
    cart = parsed
      .filter(i => i && i.id != null && i.id !== '' && typeof i.name === 'string')
      .map(i => ({
        id: String(i.id),
        name: String(i.name),
        price: Number(i.price) || 0,
        icon: String(i.icon || 'fa-box'),
        qty: Math.max(1, parseInt(i.qty) || 1)
      }));
  } catch (e) {
    cart = [];
  }
}

/* ============================================================
   CONFIG CHECK
   ============================================================ */
(function checkConfig(){
  const errs = [];
  if (!firebaseConfig.apiKey || !firebaseConfig.apiKey.startsWith('AIza')) errs.push('apiKey');
  if (!firebaseConfig.databaseURL) errs.push('databaseURL');
  if (errs.length) {
    document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>Config Missing</h2><p>Add your Firebase config in the HTML file.</p><pre>Missing: ${errs.join(', ')}</pre><button onclick="location.reload()">Retry</button></div></div>`;
    throw new Error('Config missing');
  }
})();

let app, auth, db;
try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
  setPersistence(auth, browserLocalPersistence).catch(()=>{});
  console.log('✅ Firebase ready');
} catch (e) {
  document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>Init Failed</h2><pre>${esc(e.message)}</pre><button onclick="location.reload()">Retry</button></div></div>`;
  throw e;
}

          <span>Sign in with Google</span>
        </button>

  document.getElementById('gbtn').onclick = async () => {
    const btn = document.getElementById('gbtn');
    btn.disabled = true;
    btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Connecting…';

      const provider = new GoogleAuthProvider();

        'auth/popup-blocked':'Popup blocked — allow popups',
        'auth/popup-closed-by-user':'Sign-in cancelled',
        'auth/unauthorized-domain':'Domain not authorized',
        'auth/operation-not-allowed':'Google sign-in not enabled'

          </div>
        </div>
        <div class="m-foot">
          <button class="bs" id="cancelUser">Close</button>
          <button class="bd" id="signOutBtn"><i class="fas fa-arrow-right-from-bracket"></i> Sign Out</button>
        </div>
      </div>
    </div>
  `;

  wireEvents();
  loadCart();
  renderProducts();
  renderCart();
  checkNetwork();
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireEvents(){
  // Search
  const si = document.getElementById('searchInput');
  const sw = document.getElementById('searchWrap');
  si.oninput = e => {
    searchQuery = e.target.value.toLowerCase();
    sw.classList.toggle('has-text', searchQuery.length > 0);
    renderProducts();
  };
  document.getElementById('clearSearch').onclick = () => {
    si.value = ''; searchQuery = '';
    sw.classList.remove('has-text');
    renderProducts();
    si.focus();
  };

  // Category chips
  document.getElementById('chips').onclick = e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    document.getElementById('favBtn').classList.remove('active');
    activeCategory = c.dataset.cat;
    renderProducts();
  };

  // Favorites
  document.getElementById('favBtn').onclick = () => {
    const btn = document.getElementById('favBtn');
    const isFav = btn.classList.toggle('active');
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    activeCategory = isFav ? 'favorites' : 'all';
    if (!isFav) document.querySelector('.chip[data-cat="all"]').classList.add('active');
    renderProducts();
  };

  // Scanner
  document.getElementById('scanBtn').onclick = () => openScanner('cart');
  document.getElementById('closeScan').onclick = closeScanner;
  document.getElementById('manualBtn').onclick = () => {
    const v = document.getElementById('manualCode').value.trim();
    if (v) handleScan(v);
  };
  document.getElementById('manualCode').onkeypress = e => {
    if (e.key === 'Enter') {
      const v = e.target.value.trim();
      if (v) handleScan(v);
    }
  };

  // Cart
  document.getElementById('chargeBtn').onclick = openCheckout;
  document.getElementById('clearCartBtn').onclick = () => {
    if (cart.length === 0) return;
    if (!confirm('Clear the entire cart?')) return;
    cart = [];
    saveCart();
    renderCart();
    renderProducts();
    toast('Cart cleared', 'info');
  };

  // Checkout
  document.getElementById('closeCheckout').onclick = () => closeModal('checkoutModal');
  document.getElementById('cancelCheckout').onclick = () => closeModal('checkoutModal');
  document.getElementById('confirmCheckout').onclick = completeSale;

  document.querySelectorAll('.pay-opt').forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('active'));
      opt.classList.add('active');
      selectedPayment = opt.dataset.method;
      document.getElementById('cashSection').style.display = selectedPayment === 'cash' ? 'block' : 'none';
      document.getElementById('checkoutTotal').textContent = money(cartTotal());
      updateChangeDisplay();
    };
  });

  // Quick cash buttons (KSh notes)
  const quickAmounts = [50, 100, 200, 500, 1000, 2000];
  document.getElementById('quickCash').innerHTML = quickAmounts.map(v =>
    `<button data-cash="${v}">${v >= 1000 ? (v/1000)+'K' : v}</button>`
  ).join('') + '<button data-cash="exact">Exact</button><button data-cash="clear">Clear</button>';

  document.getElementById('quickCash').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    vibrate(8);
    const v = b.dataset.cash;
    if (v === 'exact') cashReceived = cartTotal();
    else if (v === 'clear') cashReceived = 0;
    else cashReceived += parseFloat(v);
    document.getElementById('cashInput').value = cashReceived > 0 ? cashReceived : '';
    updateChangeDisplay();
  };

  document.getElementById('cashInput').oninput = e => {
    cashReceived = parseFloat(e.target.value) || 0;
    updateChangeDisplay();
  };

  // Receipt
  document.getElementById('closeReceipt').onclick = () => closeModal('receiptModal');
  document.getElementById('newSaleBtn').onclick = () => closeModal('receiptModal');
  document.getElementById('printBtn').onclick = () => window.print();

  // Product menu
  document.getElementById('closeMenu').onclick = () => closeModal('menuModal');

  // Edit
  document.getElementById('closeEdit').onclick = () => closeModal('editModal');
  document.getElementById('cancelEdit').onclick = () => closeModal('editModal');
  document.getElementById('saveEdit').onclick = saveProductEdit;

  // Stock
  document.getElementById('closeStock').onclick = () => closeModal('stockModal');
  document.getElementById('stockAmount').oninput = updateStockPreview;
  document.getElementById('stockAdd').onclick = () => changeStock(1);
  document.getElementById('stockRemove').onclick = () => changeStock(-1);

  // PIN
  document.getElementById('closePin').onclick = () => { closeModal('pinModal'); pinCallback = null; pinBuffer = ''; };
  const pad = document.getElementById('pinPad');
  pad.innerHTML = [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => {
    if (k === '') return '<div></div>';
    const isBack = k === '⌫';
    return `<button class="pin-key ${isBack?'danger':''}" data-pin="${k}">${isBack?'<i class="fas fa-delete-left"></i>':k}</button>`;
  }).join('');
  pad.onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    handlePinInput(b.dataset.pin);
  };

  // User
  document.getElementById('userChip').onclick = () => openModal('userModal');
  document.getElementById('closeUser').onclick = () => closeModal('userModal');
  document.getElementById('cancelUser').onclick = () => closeModal('userModal');
  document.getElementById('signOutBtn').onclick = () => signOut(auth);

  // Close on overlay tap
  document.querySelectorAll('.modal').forEach(m => {
    m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); });
  });

  window.addEventListener('online', checkNetwork);
  window.addEventListener('offline', checkNetwork);
}

function openModal(id){ document.getElementById(id).classList.add('open'); }
function closeModal(id){ document.getElementById(id).classList.remove('open'); }

/* ============================================================
   PRODUCTS
   ============================================================ */
function renderProducts(){
  const grid = document.getElementById('grid');
  if (!grid) return;

  let list = allProducts.slice();
  if (activeCategory === 'favorites') list = list.filter(p => favorites.includes(p.id));
  else if (activeCategory !== 'all') list = list.filter(p => p.category === activeCategory);
  if (searchQuery) {
    list = list.filter(p =>
      (p.name||'').toLowerCase().includes(searchQuery) ||
      (p.barcode||'').includes(searchQuery) ||
      (p.category||'').toLowerCase().includes(searchQuery)
    );
  }

  if (list.length === 0) {
    grid.innerHTML = `<div class="empty"><i class="fas fa-box-open"></i><p>No products found</p></div>`;
    return;
  }

  if (activeCategory === 'all' && !searchQuery) {
    list.sort((a,b) => (favorites.includes(b.id)?1:0) - (favorites.includes(a.id)?1:0));
  }

  grid.innerHTML = list.map(p => {
    const stock = p.stock ?? 0;
    const oos = stock <= 0 && p.stock !== undefined;
    const low = stock > 0 && stock <= 5;
    const inCart = cart.find(i => String(i.id) === String(p.id));
    const fav = favorites.includes(p.id);
    return `
      <div class="card ${oos?'oos':''} ${fav?'fav':''}" data-id="${esc(p.id)}">
        ${inCart ? `<div class="card-badge">${inCart.qty}</div>` : ''}
        <button class="card-menu" data-menu="${esc(p.id)}"><i class="fas fa-ellipsis-vertical"></i></button>
        <div class="card-icon"><i class="fas ${esc(p.icon || 'fa-box')}"></i></div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-price">${money(p.price)}</div>
        <div class="card-stock ${oos?'out':low?'low':''}">${p.stock !== undefined ? stock + ' in stock' : ''}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.onclick = e => {
      if (e.target.closest('.card-menu')) return;
      const p = allProducts.find(x => String(x.id) === String(card.dataset.id));
      if (p) addToCart(p);
    };
    let pressTimer;
    const startPress = () => {
      pressTimer = setTimeout(() => {
        vibrate(30);
        toggleFavorite(card.dataset.id);
      }, 600);
    };
    const cancelPress = () => clearTimeout(pressTimer);
    card.addEventListener('touchstart', startPress, {passive:true});
    card.addEventListener('touchend', cancelPress, {passive:true});
    card.addEventListener('touchmove', cancelPress, {passive:true});
    card.addEventListener('mousedown', startPress);
    card.addEventListener('mouseup', cancelPress);
    card.addEventListener('mouseleave', cancelPress);
  });

  grid.querySelectorAll('.card-menu').forEach(btn => {
    btn.onclick = e => {
      e.stopPropagation();
      openProductMenu(btn.dataset.menu);
    };
  });
}

function toggleFavorite(id){
  const i = favorites.indexOf(id);
  if (i >= 0) { favorites.splice(i,1); toast('Removed from favorites', 'info'); }
  else { favorites.push(id); toast('Added to favorites', 'success'); }
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch(e){}
  renderProducts();
}

/* ============================================================
   PRODUCT MENU
   ============================================================ */
function openProductMenu(id){
  const p = allProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  activeProductMenu = p;
  document.getElementById('menuBody').innerHTML = `
    <div style="text-align:center;padding:6px 0 12px">
      <div style="font-size:1rem;font-weight:800">${esc(p.name)}</div>
      <div style="font-size:.78rem;color:var(--text3);margin-top:2px">${esc(p.category||'—')} · Stock: ${p.stock??0}</div>
      ${p.barcode ? `<div style="font-family:monospace;font-size:.72rem;color:var(--text3);margin-top:4px">${esc(p.barcode)}</div>` : ''}
    </div>
    <div class="action-grid">
      <button class="action-card" data-act="edit"><i class="fas fa-pen"></i><div class="t">Edit Details</div><div class="s">Name, price, category</div></button>
      <button class="action-card" data-act="stock"><i class="fas fa-boxes-packing"></i><div class="t">Adjust Stock</div><div class="s">Add or remove units</div></button>
      <button class="action-card" data-act="barcode"><i class="fas fa-barcode"></i><div class="t">Change Barcode</div><div class="s">Scan or type new</div></button>
      <button class="action-card" data-act="favorite"><i class="fas fa-star" style="color:${favorites.includes(p.id)?'var(--warning)':'var(--accentB)'}"></i><div class="t">${favorites.includes(p.id)?'Unfavorite':'Favorite'}</div><div class="s">Pin to top</div></button>
      <button class="action-card danger" data-act="delete" style="grid-column:1/-1"><i class="fas fa-trash"></i><div class="t">Delete Product</div><div class="s">Remove from catalog</div></button>
    </div>
  `;
  document.getElementById('menuBody').querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => {
      const act = btn.dataset.act;
      closeModal('menuModal');
      setTimeout(() => runProductAction(act), 150);
    };
  });
  openModal('menuModal');
}

function runProductAction(action){
  const p = activeProductMenu;
  if (!p) return;
  const needsPin = ['edit', 'stock', 'barcode', 'delete'].includes(action);
  if (!needsPin) {
    if (action === 'favorite') toggleFavorite(p.id);
    return;
  }
  requestPin(`Enter PIN to ${action} "${p.name}"`, () => {
    if (action === 'edit') openEditProduct(p);
    else if (action === 'stock') openStockAdjust(p);
    else if (action === 'barcode') openScanner('barcode-assign');
    else if (action === 'delete') deleteProduct(p);
  });
}

/* ============================================================
   EDIT PRODUCT
   ============================================================ */
function openEditProduct(p){
  document.getElementById('editName').value = p.name || '';
  document.getElementById('editPrice').value = p.price || 0;
  document.getElementById('editCat').value = p.category || 'accessories';
  document.getElementById('editBarcode').value = p.barcode || '';
  openModal('editModal');
}

async function saveProductEdit(){
  const p = activeProductMenu;
  if (!p) return;
  const name = document.getElementById('editName').value.trim();
  const price = parseFloat(document.getElementById('editPrice').value);
  const category = document.getElementById('editCat').value;
  const barcode = document.getElementById('editBarcode').value.trim();

  if (!name || isNaN(price) || price <= 0) {
    toast('Enter valid name and price', 'warning');
    return;
  }

  try {
    await update(ref(db, `products/${p.id}`), {
      name: String(name),
      price: +price.toFixed(2),
      category: String(category),
      icon: iconFor(category),
      barcode: String(barcode)
    });
    closeModal('editModal');
    toast('Product updated', 'success');
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  }
}

/* ============================================================
   STOCK
   ============================================================ */
function openStockAdjust(p){
  document.getElementById('stockName').textContent = p.name;
  document.getElementById('stockCurrent').textContent = p.stock ?? 0;
  document.getElementById('stockAmount').value = 1;
  updateStockPreview();
  openModal('stockModal');
}

function updateStockPreview(){
  const p = activeProductMenu;
  if (!p) return;
  const current = p.stock ?? 0;
  const amt = parseInt(document.getElementById('stockAmount').value) || 0;
  document.getElementById('stockAfter').textContent = current + amt;
}

async function changeStock(direction){
  const p = activeProductMenu;
  if (!p) return;
  const amt = parseInt(document.getElementById('stockAmount').value) || 0;
  if (amt <= 0) { toast('Enter valid amount', 'warning'); return; }
  const change = direction * amt;
  const newStock = Math.max(0, (p.stock || 0) + change);

  try {
    const histKey = push(ref(db, `products/${p.id}/stockHistory`)).key;
    await update(ref(db, `products/${p.id}`), {
      stock: newStock,
      [`stockHistory/${histKey}`]: {
        change: Number(change),
        after: Number(newStock),
        by: String(currentUser.name || 'Staff'),
        timestamp: Date.now()
      }
    });
    toast('Stock updated → ' + newStock, 'success');
    closeModal('stockModal');
  } catch (e) {
    toast('Failed: ' + e.message, 'error');
  }
}

/* ============================================================
   DELETE
   ============================================================ */
async function deleteProduct(p){
  if (!confirm(`Delete "${p.name}"?\n\nCannot be undone.`)) return;
  try {
    await remove(ref(db, `products/${p.id}`));
    toast('Product deleted', 'success');
  } catch (e) {
    toast('Delete failed: ' + e.message, 'error');
  }
}

/* ============================================================
   PIN
   ============================================================ */
function requestPin(msg, cb){
  pinBuffer = '';
  pinCallback = cb;
  document.getElementById('pinMsg').textContent = msg;
  document.getElementById('pinErr').textContent = '';
  document.querySelectorAll('#pinDots .pin-dot').forEach(d => {
    d.style.background = 'var(--bg3)';
    d.style.borderColor = 'var(--border)';
  });
  openModal('pinModal');
}

function handlePinInput(k){
  if (k === '⌫') pinBuffer = pinBuffer.slice(0, -1);
  else if (pinBuffer.length < 4) pinBuffer += k;

  document.querySelectorAll('#pinDots .pin-dot').forEach((d, i) => {
    const filled = i < pinBuffer.length;
    d.style.background = filled ? 'var(--accent)' : 'var(--bg3)';
    d.style.borderColor = filled ? 'var(--accent)' : 'var(--border)';
  });

  if (pinBuffer.length === 4) {
    setTimeout(() => {
      if (pinBuffer === MANAGER_PIN) {
        closeModal('pinModal');
        const cb = pinCallback;
        pinCallback = null;
        pinBuffer = '';
        if (cb) cb();
      } else {
        document.getElementById('pinErr').textContent = 'Incorrect PIN';
        vibrate([40, 30, 40]);
        pinBuffer = '';
        document.querySelectorAll('#pinDots .pin-dot').forEach(d => {
          d.style.background = 'var(--bg3)';
          d.style.borderColor = 'var(--border)';
        });
      }
    }, 120);
  }
}

/* ============================================================
   CART
   ============================================================ */
function addToCart(p){
  if (!p || p.id == null || p.id === '') {
    toast('Invalid product', 'error');
    return;
  }
  if (p.stock !== undefined && p.stock <= 0) {
    toast('Out of stock', 'warning');
    vibrate([40, 30, 40]);
    return;
  }
  const existing = cart.find(i => String(i.id) === String(p.id));
  if (existing) {
    if (p.stock !== undefined && existing.qty >= p.stock) {
      toast('Not enough stock', 'warning');
      vibrate([40, 30, 40]);
      return;
    }
    existing.qty += 1;
  } else {
    cart.push({
      id: String(p.id),
      name: String(p.name || 'Unknown'),
      price: Number(p.price) || 0,
      icon: String(p.icon || 'fa-box'),
      qty: 1
    });
  }
  vibrate(12);
  saveCart();
  renderCart();
  renderProducts();
}

function changeQty(id, delta){
  const item = cart.find(i => String(i.id) === String(id));
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => String(i.id) !== String(id));
  vibrate(8);
  saveCart();
  renderCart();
  renderProducts();
}

function removeFromCart(id){
  const item = cart.find(i => String(i.id) === String(id));
  if (!item) return;
  lastRemoved = { item: {...item}, index: cart.findIndex(i => String(i.id) === String(id)) };
  cart = cart.filter(i => String(i.id) !== String(id));
  vibrate(20);
  saveCart();
  renderCart();
  renderProducts();
  toast(`Removed "${item.name}"`, 'info', 4000, true);
}

function undoRemove(){
  if (!lastRemoved) return;
  cart.splice(lastRemoved.index, 0, lastRemoved.item);
  lastRemoved = null;
  saveCart();
  renderCart();
  renderProducts();
  toast('Restored', 'success');
}

function renderCart(){
  const items = document.getElementById('cartItems');
  if (!items) return;
  document.getElementById('cartCount').textContent = cartCount();

  if (cart.length === 0) {
    items.innerHTML = `<div class="cart-empty"><i class="fas fa-shopping-basket"></i><p>Cart is empty</p></div>`;
  } else {
    items.innerHTML = cart.map(i => `
      <div class="c-item" data-id="${esc(i.id)}">
        <div class="c-icon"><i class="fas ${esc(i.icon)}"></i></div>
        <div class="c-info">
          <h4>${esc(i.name)}</h4>
          <p>${money(i.price)} × ${i.qty}</p>
        </div>
        <div class="c-actions">
          <button class="qbtn" data-dec="${esc(i.id)}">−</button>
          <span class="qval">${i.qty}</span>
          <button class="qbtn" data-inc="${esc(i.id)}">+</button>
          <button class="del-btn" data-del="${esc(i.id)}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`).join('');

    items.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => changeQty(b.dataset.inc, 1));
    items.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => changeQty(b.dataset.dec, -1));
    items.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeFromCart(b.dataset.del));
  }

  document.getElementById('sumSub').textContent = money(cartSubtotal());
  document.getElementById('sumTax').textContent = money(cartTax());
  document.getElementById('sumTotal').textContent = money(cartTotal());
}

/* ============================================================
   CHECKOUT — FIXED
   ============================================================ */
function openCheckout(){
  if (cart.length === 0) { toast('Cart is empty', 'warning'); return; }
  selectedPayment = 'cash';
  cashReceived = 0;
  document.querySelectorAll('.pay-opt').forEach(x => x.classList.toggle('active', x.dataset.method === 'cash'));
  document.getElementById('cashSection').style.display = 'block';
  document.getElementById('cashInput').value = '';
  document.getElementById('checkoutTotal').textContent = money(cartTotal());
  updateChangeDisplay();
  openModal('checkoutModal');
}

function updateChangeDisplay(){
  document.getElementById('cashDisp').textContent = money(cashReceived);
  const total = cartTotal();
  const change = cashReceived - total;
  const box = document.getElementById('changeBox');
  const amt = document.getElementById('changeAmt');
  amt.textContent = money(Math.abs(change));
  box.classList.toggle('neg', change < 0);
  box.querySelector('span').textContent = change < 0 ? 'Remaining' : 'Change Due';
}

async function completeSale(){
  if (cart.length === 0) { toast('Cart is empty', 'warning'); return; }

  // 🛡️ Sanitize cart — filter out anything invalid
  const cleanCart = cart.filter(i =>
    i &&
    i.id != null && String(i.id) !== '' &&
    typeof i.name === 'string' && i.name.length > 0 &&
    typeof i.price === 'number' && !isNaN(i.price) &&
    typeof i.qty === 'number' && i.qty > 0
  );

  if (cleanCart.length === 0) {
    toast('Cart has invalid items — cleared', 'error');
    cart = [];
    saveCart();
    renderCart();
    renderProducts();
    return;
  }

  // Restore sanitized cart
  cart = cleanCart;

  const total = cartTotal();
  if (selectedPayment === 'cash' && cashReceived < total) {
    toast('Cash received is less than total', 'warning');
    vibrate([40, 30, 40]);
    return;
  }

  const btn = document.getElementById('confirmCheckout');
  btn.disabled = true;
  btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…';

  // 🛡️ Build fully sanitized sale object — every field is defined
  const sale = {
    items: cart.map(i => ({
      productId: String(i.id),
      name: String(i.name),
      price: Number(i.price),
      qty: Number(i.qty),
      lineTotal: +(Number(i.price) * Number(i.qty)).toFixed(2)
    })),
    subtotal: +cartSubtotal().toFixed(2),
    vat: +cartTax().toFixed(2),
    vatRate: VAT_RATE,
    total: +total.toFixed(2),
    currency: 'KSh',
    paymentMethod: String(selectedPayment || 'cash'),
    cashReceived: selectedPayment === 'cash' ? +cashReceived.toFixed(2) : null,
    change: selectedPayment === 'cash' ? +(cashReceived - total).toFixed(2) : null,
    staff: String(currentUser.name || 'Staff'),
    staffId: String(currentUser.uid || 'unknown'),
    timestamp: Date.now(),
    status: 'completed'
  };

  try {
    if (isOnline) {
      // 1. Save transaction
      const txRef = push(ref(db, 'transactions'));
      await set(txRef, { ...sale, timestamp: serverTimestamp() });

      // 2. Decrement stock — sanitized loop
      for (const item of cart) {
        const p = allProducts.find(x => String(x.id) === String(item.id));
        if (p && typeof p.stock === 'number') {
          const newStock = Math.max(0, p.stock - item.qty);
          await update(ref(db, `products/${p.id}`), { stock: newStock });
        }
      }
      console.log('✅ Sale saved:', sale.total);
    } else {
      offlineQueue.push(sale);
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(offlineQueue));
      toast('Sale queued (offline)', 'warning');
    }

    // Show receipt
    showReceipt(sale);

    // Reset
    cart = [];
    saveCart();
    renderCart();
    renderProducts();

    closeModal('checkoutModal');
    toast(`Sale complete — ${money(total)}`, 'success');
    vibrate([30, 50, 30]);
  } catch (e) {
    console.error('[ElectroPOS] Sale failed:', e);
    toast('Sale failed: ' + (e.message || 'unknown error'), 'error', 4000);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '<i class="fas fa-check"></i> Complete';
  }
}

function showReceipt(sale){
  const date = new Date(sale.timestamp).toLocaleString();
  document.getElementById('receiptBody').innerHTML = `
    <div class="receipt">
      <h2>ELECTROPOS</h2>
      <div class="div"></div>
      <div class="row"><span>Date:</span><span>${date}</span></div>
      <div class="row"><span>Staff:</span><span>${esc(sale.staff)}</span></div>
      <div class="row"><span>Payment:</span><span>${esc(sale.paymentMethod.toUpperCase())}</span></div>
      <div class="div"></div>
      <div class="row hdr"><span>Item</span><span>Total</span></div>
      <div class="div"></div>
      ${sale.items.map(i => `
        <div class="row"><span>${esc(i.name)}</span><span>${money(i.lineTotal)}</span></div>
        <div style="font-size:.7rem;color:#444;padding-left:6px">${i.qty} × ${money(i.price)}</div>
      `).join('')}
      <div class="div"></div>
      <div class="row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
      <div class="row"><span>VAT (16%)</span><span>${money(sale.vat)}</span></div>
      <div class="row total"><span>TOTAL</span><span>${money(sale.total)}</span></div>
      ${sale.paymentMethod === 'cash' ? `
        <div class="div"></div>
        <div class="row"><span>Cash</span><span>${money(sale.cashReceived)}</span></div>
        <div class="row"><span>Change</span><span>${money(sale.change)}</span></div>
      ` : ''}
      <div class="div"></div>
      <div class="center" style="margin-top:8px;font-weight:700">Thank you</div>
    </div>`;
  openModal('receiptModal');
}

/* ============================================================
   SCANNER
   ============================================================ */
function openScanner(target){
  scannerTarget = target || 'cart';
  const title = document.getElementById('scanTitle');
  if (target === 'cart') title.textContent = 'Scan to Add';
  else if (target === 'barcode-edit') title.textContent = 'Scan for Edit';
  else if (target === 'barcode-assign') title.textContent = 'Scan to Assign';
  openModal('scanModal');
  lastScannedCode = null;
  lastScannedAt = 0;

  const status = document.getElementById('scanStatus');
  if (!window.ZXing) { status.textContent = '⚠️ Scanner not loaded. Type barcode below.'; return; }

  scanner = new ZXing.BrowserMultiFormatReader();
  scannerActive = true;
  status.textContent = 'Starting camera…';
  status.classList.remove('ok');

  scanner.decodeFromVideoDevice(null, 'scanVideo', (result, err) => {
    if (!scannerActive) return;
    if (result) {
      const code = result.getText();
      const now = Date.now();
      if (code === lastScannedCode && (now - lastScannedAt) < 2000) return;
      lastScannedCode = code;
      lastScannedAt = now;
      status.textContent = '✅ ' + code;
      status.classList.add('ok');
      vibrate(20);
      handleScan(code);
    }
  }).catch(e => {
    console.error(e);
    status.textContent = '⚠️ Camera unavailable. Type barcode below.';
  });
}

function closeScanner(){
  closeModal('scanModal');
  scannerActive = false;
  if (scanner) { try { scanner.reset(); } catch(e){} scanner = null; }
  const v = document.getElementById('scanVideo');
  if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  document.getElementById('manualCode').value = '';
}

function handleScan(code){
  if (scannerTarget === 'barcode-edit') {
    document.getElementById('editBarcode').value = code;
    toast('Barcode set', 'success');
    closeScanner();
    return;
  }
  if (scannerTarget === 'barcode-assign') {
    const p = activeProductMenu;
    if (!p) { closeScanner(); return; }
    update(ref(db, `products/${p.id}`), { barcode: String(code) })
      .then(() => toast('Barcode saved', 'success'))
      .catch(e => toast('Failed: ' + e.message, 'error'));
    closeScanner();
    return;
  }

  const product = allProducts.find(p => String(p.barcode) === String(code) || String(p.id) === String(code));
  if (product) {
    addToCart(product);
    toast('Added: ' + product.name, 'success');
  } else {
    toast('Not found: ' + code, 'warning');
  }
  closeScanner();
}

/* ============================================================
   NETWORK / OFFLINE
   ============================================================ */
function checkNetwork(){
  isOnline = navigator.onLine;
  const bar = document.getElementById('offlineBar');
  if (bar) bar.classList.toggle('show', !isOnline);
  if (isOnline && offlineQueue.length > 0) syncOffline();
}

async function syncOffline(){
  const q = [...offlineQueue];
  offlineQueue = [];
  localStorage.removeItem(OFFLINE_KEY);
  let synced = 0;
  for (const sale of q) {
    try {
      await set(push(ref(db, 'transactions')), { ...sale, timestamp: serverTimestamp() });
      synced++;
    } catch (e) { offlineQueue.push(sale); }
  }
  if (offlineQueue.length > 0) {
    localStorage.setItem(OFFLINE_KEY, JSON.stringify(offlineQueue));
  } else if (synced > 0) {
    toast(`Synced ${synced} offline sale${synced !== 1 ? 's' : ''}`, 'success');
  }
}

/* ============================================================
   BOOT + AUTH
   ============================================================ */
(async () => {
  try {
    const r = await getRedirectResult(auth);
    if (r && r.user) console.log('Redirect resolved:', r.user.email);
  } catch (e) { console.error('Redirect error:', e); }
})();

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    shellRendered = false;
    currentUser = null;
    renderLogin('');
    return;
  }

  // Verify registered
  try {
    const snap = await get(ref(db, 'users'));
    const users = snap.val() || {};
    const entry = Object.entries(users).find(([uid, u]) =>
      u && u.email && u.email.toLowerCase().trim() === (user.email || '').toLowerCase().trim()
    );
    if (!entry) {
      await signOut(auth);
      renderLogin(`"${user.email}" not registered.`);
      return;
    }
    currentUser = {
      uid: user.uid,
      email: user.email,
      name: entry[1].name || user.displayName || user.email.split('@')[0],
      role: entry[1].role || 'staff',
      photoURL: user.photoURL || null
    };
  } catch (e) {
    currentUser = {
      uid: user.uid,
      email: user.email,
      name: user.displayName || user.email.split('@')[0],
      role: 'staff',
      photoURL: user.photoURL || null
    };
  }

  // Load local state
  try {
    const f = localStorage.getItem(FAV_KEY);
    if (f) favorites = JSON.parse(f) || [];
    const q = localStorage.getItem(OFFLINE_KEY);
    if (q) offlineQueue = JSON.parse(q) || [];
  } catch (e) {}

  // Live products
  onValue(ref(db, 'products'), snap => {
    const data = snap.val() || {};
    allProducts = Object.entries(data).map(([id, val]) => ({ id, ...val }));
    if (shellRendered) {
      renderProducts();
      renderCart();
    }
  });

  if (!shellRendered) {
    shellRendered = true;
    try {
      renderUI();
      console.log('✅ UI ready');
    } catch (e) {
      console.error('Render error:', e);
      document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>UI Error</h2><pre>${esc(e.message)}</pre><button onclick="location.reload()">Retry</button></div></div>`;
    }
  }

  if (isOnline && offlineQueue.length > 0) syncOffline();
});
</script>
