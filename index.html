<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ElectroPOS · Staff</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://unpkg.com/@zxing/library@0.20.0/umd/index.min.js"></script>
<style>
:root{
  --bg:#050a14;--bg2:#0a1524;--bg3:#101d33;--bg4:#182a47;
  --border:rgba(59,130,246,.14);--border2:rgba(59,130,246,.32);
  --accent:#3b82f6;--accent2:#2563eb;--accentB:#60a5fa;--accentS:rgba(59,130,246,.14);--glow:rgba(59,130,246,.5);
  --success:#10b981;--warning:#f59e0b;--danger:#ef4444;--purple:#8b5cf6;
  --mpesa:#00a651;--mpesa-light:#4ade80;--mpesa-dark:#007a3d;
  --text:#fff;--text2:#a8b8d0;--text3:#64748b;
  --r-sm:12px;--r-md:16px;--r-lg:22px;--r-xl:28px;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
  --nav-h:64px;
  --nav-h-total:calc(var(--nav-h) + var(--safe-bottom));
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-touch-callout:none;-webkit-font-smoothing:antialiased}
html,body{height:100%;overflow:hidden;position:fixed;width:100%;overscroll-behavior:none}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:15px;line-height:1.5}
input,button,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
input{-webkit-appearance:none;appearance:none}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}

.loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;background:var(--bg);z-index:9999}
.spinner{width:52px;height:52px;border:3px solid var(--bg3);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading p{color:var(--text2);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.fatal{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg)}
.fatal-card{max-width:480px;width:100%;background:var(--bg2);border:1px solid rgba(239,68,68,.4);border-radius:var(--r-xl);padding:28px 22px}
.fatal-card h2{font-size:1.2rem;font-weight:800;margin-bottom:10px;color:var(--danger)}
.fatal-card p{color:var(--text2);font-size:.9rem;margin-bottom:14px;line-height:1.6}
.fatal-card pre{background:var(--bg3);border-radius:var(--r-sm);padding:12px;color:var(--warning);font-size:.78rem;overflow:auto;white-space:pre-wrap;max-height:220px;font-family:monospace;margin-bottom:14px}
.fatal-card button{width:100%;padding:14px;background:var(--accent);color:#fff;border-radius:var(--r-md);font-weight:700;font-size:1rem}

.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:radial-gradient(circle at 30% 20%,rgba(59,130,246,.15),transparent 50%),var(--bg)}
.login-card{width:100%;max-width:380px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xl);padding:32px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 24px 60px rgba(0,0,0,.7)}
.login-icon{width:68px;height:68px;margin:0 auto 4px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff}
.login-card h1{text-align:center;font-size:1.5rem;font-weight:800;background:linear-gradient(135deg,#fff,var(--accentB));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.login-card .sub{text-align:center;color:var(--text3);font-size:.7rem;letter-spacing:2.5px;text-transform:uppercase;font-weight:700;margin-top:-8px}
.login-err{color:var(--danger);font-size:.82rem;text-align:center;min-height:18px;font-weight:600}
.google-btn{width:100%;padding:15px;background:#fff;color:#1f1f1f;border-radius:var(--r-md);font-size:.98rem;font-weight:700;display:flex;align-items:center;justify-content:center;gap:10px;min-height:48px}
.google-btn:active{transform:scale(.97)}
.google-btn:disabled{opacity:.6}
.google-btn svg{width:20px;height:20px}

.hdr{display:flex;align-items:center;justify-content:space-between;padding:calc(8px + var(--safe-top)) 12px 8px;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0;gap:8px;z-index:50}
.hdr-brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.hdr-logo{width:40px;height:40px;background:linear-gradient(135deg,var(--accent),var(--purple));border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:19px;color:#fff;flex-shrink:0}
.hdr-title h1{font-size:.98rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdr-title span{font-size:.6rem;color:var(--text3);letter-spacing:1.5px;text-transform:uppercase;font-weight:700}
.hdr-actions{display:flex;align-items:center;gap:6px}
.hdr-icon-btn{width:42px;height:42px;border-radius:12px;background:var(--bg3);border:1px solid var(--border);color:var(--text2);font-size:.95rem;display:flex;align-items:center;justify-content:center;padding:0;position:relative}
.hdr-icon-btn:active{background:var(--bg4);transform:scale(.94)}
.hdr-icon-btn .badge{position:absolute;top:-4px;right:-4px;background:var(--danger);color:#fff;font-size:.62rem;font-weight:900;padding:2px 6px;border-radius:10px;min-width:18px;text-align:center}
.hdr-icon-btn.mpesa{background:linear-gradient(135deg,rgba(0,166,81,.15),rgba(0,166,81,.05));border-color:rgba(0,166,81,.35);color:var(--mpesa-light)}

.main{flex:1;display:flex;overflow:hidden;min-height:0}

.products{flex:1.6;display:flex;flex-direction:column;padding:10px;overflow:hidden;min-width:0}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.search{position:relative;flex:1;min-width:0}
.search i{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(--text3);font-size:.9rem;pointer-events:none}
.search input{width:100%;padding:13px 40px 13px 38px;background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.92rem;outline:none;min-height:48px;font-weight:500}
.search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS)}
.search input::placeholder{color:var(--text3)}
.search .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);background:var(--bg4);color:var(--text2);width:30px;height:30px;border-radius:50%;display:none;align-items:center;justify-content:center}
.search.has-text .clear{display:flex}
.tbtn{width:48px;height:48px;min-width:48px;border-radius:var(--r-md);background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;font-size:1.05rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.tbtn:active{transform:scale(.92)}
.tbtn.sec{background:var(--bg2);border:1.5px solid var(--border);color:var(--text2)}
.tbtn.sec.active{background:var(--warning);color:#000;border-color:var(--warning)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin-bottom:4px}
.chips::-webkit-scrollbar{display:none}
.chip{padding:9px 14px;background:var(--bg2);border:1.5px solid var(--border);border-radius:100px;color:var(--text2);font-size:.8rem;font-weight:700;white-space:nowrap;min-height:38px;display:flex;align-items:center}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip:active{transform:scale(.94)}

.grid{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;align-content:start;padding:2px 2px 20px;-webkit-overflow-scrolling:touch;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.grid::-webkit-scrollbar{width:4px}
.grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
@media(max-width:400px){.grid{grid-template-columns:repeat(2,1fr);gap:8px}}
@media(min-width:600px){.grid{grid-template-columns:repeat(auto-fill,minmax(155px,1fr))}}

.card{background:var(--bg2);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;cursor:pointer;user-select:none;transition:transform .12s;position:relative;min-height:135px;justify-content:center}
.card:active{transform:scale(.95);background:var(--bg3);border-color:var(--accent)}
.card.oos{opacity:.4}
.card.fav::after{content:'\f005';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:8px;left:8px;color:var(--warning);font-size:.9rem}
.card-icon{width:50px;height:50px;border-radius:13px;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-size:1.4rem;color:var(--accent);margin-bottom:8px}
.card:active .card-icon{background:var(--accent);color:#fff}
.card-name{font-size:.8rem;font-weight:700;line-height:1.3;margin-bottom:5px;min-height:32px;display:flex;align-items:center;justify-content:center}
.card-price{font-size:1rem;font-weight:900;color:var(--accentB);letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.card-stock{font-size:.66rem;color:var(--text3);margin-top:4px;font-weight:700}
.card-stock.low{color:var(--warning)}
.card-stock.out{color:var(--danger)}
.card-badge{position:absolute;top:6px;right:6px;background:var(--accent);color:#fff;padding:2px 8px;border-radius:10px;font-size:.68rem;font-weight:900;min-width:22px;text-align:center}
.card-menu{position:absolute;bottom:6px;right:6px;width:30px;height:30px;border-radius:50%;background:var(--bg4);border:1px solid var(--border);color:var(--text2);display:flex;align-items:center;justify-content:center;font-size:.75rem;padding:0;opacity:.75}
.card-menu:active{background:var(--accent);color:#fff;transform:scale(.9)}

.empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--text3)}
.empty i{font-size:3rem;opacity:.2;margin-bottom:14px;display:block}

.cart{flex:1;min-width:340px;max-width:440px;display:flex;flex-direction:column;background:var(--bg2);border-left:1px solid var(--border)}
.cart-tabs{display:flex;background:var(--bg3);border-bottom:1px solid var(--border);padding:6px;gap:4px}
.cart-tab{flex:1;padding:9px;border-radius:var(--r-sm);font-size:.75rem;font-weight:800;color:var(--text3);display:flex;align-items:center;justify-content:center;gap:6px;min-height:40px;background:transparent;text-transform:uppercase;letter-spacing:.5px}
.cart-tab.active{background:var(--accentS);color:var(--accentB)}
.cart-tab:active{transform:scale(.96)}
.cart-pane{display:none;flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;flex-direction:column}
.cart-pane.active{display:flex}

.cart-items{flex:1;overflow-y:auto;padding:10px 12px;-webkit-overflow-scrolling:touch}
.cart-items::-webkit-scrollbar{width:4px}
.cart-items::-webkit-scrollbar-thumb{background:var(--border2);border-radius:4px}
.cart-empty{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--text3);gap:10px;padding:30px 20px;text-align:center}
.cart-empty i{font-size:2.8rem;opacity:.2}

.c-item{display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-sm);margin-bottom:8px}
.c-icon{width:40px;height:40px;border-radius:10px;background:var(--bg4);display:flex;align-items:center;justify-content:center;color:var(--accent);font-size:.95rem;flex-shrink:0}
.c-info{flex:1;min-width:0}
.c-info h4{font-size:.84rem;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:2px}
.c-info p{font-size:.72rem;color:var(--text3);font-weight:600;font-variant-numeric:tabular-nums}
.c-actions{display:flex;align-items:center;gap:3px;flex-shrink:0}
.qbtn{width:32px;height:32px;border-radius:9px;background:var(--bg4);color:var(--text);font-size:1rem;font-weight:800;display:flex;align-items:center;justify-content:center;padding:0}
.qbtn:active{background:var(--accent);color:#fff;transform:scale(.88)}
.qval{min-width:24px;text-align:center;font-size:.85rem;font-weight:900;font-variant-numeric:tabular-nums}
.del-btn{width:36px;height:36px;border-radius:10px;background:rgba(239,68,68,.12);border:1px solid rgba(239,68,68,.3);color:var(--danger);font-size:.88rem;display:flex;align-items:center;justify-content:center;padding:0;margin-left:2px}
.del-btn:active{background:var(--danger);color:#fff;transform:scale(.9)}

.cart-foot{padding:12px 12px calc(12px + var(--safe-bottom));border-top:1px solid var(--border);background:var(--bg2);flex-shrink:0}
.summary{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.sumrow{display:flex;justify-content:space-between;font-size:.82rem;color:var(--text2);font-weight:600}
.sumrow.total{font-size:1.2rem;font-weight:900;padding-top:10px;border-top:1px dashed var(--border);margin-top:5px}
.sumrow.total span:last-child{color:var(--accentB);font-variant-numeric:tabular-nums}
.c-actions-row{display:flex;gap:8px}
.act-btn{flex:1;padding:14px 8px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text2);font-size:.85rem;font-weight:800;display:flex;align-items:center;justify-content:center;gap:6px;min-height:48px}
.act-btn:active{transform:scale(.96)}
.act-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:900}
.act-btn:disabled{opacity:.5}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:1000;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.modal.open{opacity:1;pointer-events:auto}
.m-content{width:100%;max-width:540px;background:var(--bg2);border:1px solid var(--border2);border-radius:var(--r-xl) var(--r-xl) 0 0;display:flex;flex-direction:column;max-height:94dvh;transform:translateY(24px);transition:transform .25s;padding-bottom:var(--safe-bottom)}
.modal.open .m-content{transform:translateY(0)}
.m-hdr{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--border);background:var(--bg3);border-radius:var(--r-xl) var(--r-xl) 0 0;position:relative}
.m-hdr::before{content:'';position:absolute;top:6px;left:50%;transform:translateX(-50%);width:44px;height:4px;background:var(--border2);border-radius:4px}
.m-hdr h3{font-size:1rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-top:8px}
.m-hdr h3 i{color:var(--accentB)}
.m-close{width:38px;height:38px;border-radius:50%;background:var(--bg4);color:var(--text2);font-size:1rem;display:flex;align-items:center;justify-content:center;margin-top:8px;padding:0}
.m-close:active{background:rgba(239,68,68,.2);color:var(--danger)}
.m-body{padding:18px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;flex:1}
.m-foot{padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;background:var(--bg3)}
.m-foot button{flex:1;padding:15px;border-radius:var(--r-md);font-size:.92rem;font-weight:800;min-height:48px}
.m-foot button:active{transform:scale(.97)}

.bp{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.bs{background:var(--bg4);color:var(--text2);border:1.5px solid var(--border)}
.bd{background:rgba(239,68,68,.15);color:var(--danger);border:1.5px solid rgba(239,68,68,.35)}
.bok{background:linear-gradient(135deg,var(--success),#059669);color:#fff;font-weight:900}
.bok:disabled{opacity:.5}
.bmpesa{background:linear-gradient(135deg,var(--mpesa),var(--mpesa-dark));color:#fff;font-weight:900}

.form-field{position:relative;margin-top:6px}
.form-field label{position:absolute;top:-8px;left:12px;background:var(--bg2);padding:0 6px;font-size:.66rem;color:var(--text3);font-weight:800;text-transform:uppercase;letter-spacing:1px}
.form-field input,.form-field select{padding:14px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.98rem;outline:none;width:100%;min-height:48px;font-weight:600}
.form-field input:focus,.form-field select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentS)}

.pay-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pay-opt{padding:16px 8px;background:var(--bg3);border:2px solid var(--border);border-radius:var(--r-md);display:flex;flex-direction:column;align-items:center;gap:8px;min-height:78px;justify-content:center}
.pay-opt.active{border-color:var(--accent);background:var(--accentS)}
.pay-opt.active.mpesa{border-color:var(--mpesa);background:rgba(0,166,81,.12)}
.pay-opt i{font-size:1.5rem;color:var(--text2)}
.pay-opt.active i{color:var(--accentB)}
.pay-opt.active.mpesa i{color:var(--mpesa-light)}
.pay-opt span{font-size:.78rem;font-weight:800;color:var(--text2)}
.pay-opt.active span{color:var(--accentB)}
.pay-opt.active.mpesa span{color:var(--mpesa-light)}

.cash-box{background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);padding:14px}
.cash-amt{text-align:center;padding:12px;background:var(--bg4);border-radius:var(--r-md);margin-bottom:10px}
.cash-amt span{display:block;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:4px}
.cash-amt strong{font-size:1.7rem;font-weight:900;color:var(--accentB);font-variant-numeric:tabular-nums}
.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.quick-cash button{padding:11px 4px;background:var(--bg4);border:1.5px solid var(--border);border-radius:var(--r-sm);color:var(--text);font-weight:800;font-size:.78rem;min-height:42px}
.quick-cash button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
.change-disp{text-align:center;padding:14px;background:var(--bg4);border-radius:var(--r-md);margin-top:10px}
.change-disp span{display:block;font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;font-weight:800;margin-bottom:5px}
.change-disp strong{font-size:1.7rem;font-weight:900;color:var(--success);font-variant-numeric:tabular-nums}
.change-disp.neg strong{color:var(--danger)}
.change-disp.neg{background:rgba(239,68,68,.1)}

.mpesa-panel{background:linear-gradient(135deg,rgba(0,166,81,.12),rgba(0,166,81,.03));border:1.5px solid rgba(0,166,81,.35);border-radius:var(--r-md);padding:16px}
.mpesa-panel .mp-hdr{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.mpesa-panel .mp-hdr i{color:var(--mpesa-light);font-size:1.1rem}
.mpesa-panel .mp-hdr span{font-size:.85rem;font-weight:800;color:var(--mpesa-light);text-transform:uppercase;letter-spacing:1px}
.mpesa-float-info{display:flex;justify-content:space-between;padding:10px 12px;background:rgba(0,0,0,.2);border-radius:var(--r-sm);font-size:.78rem;margin-bottom:10px}
.mpesa-float-info .lbl{color:var(--text3);font-weight:700}
.mpesa-float-info .val{color:var(--mpesa-light);font-weight:900;font-variant-numeric:tabular-nums}
.mpesa-float-info.warn .val{color:var(--danger)}

.scan-view{position:relative;width:100%;aspect-ratio:4/3;background:#000;border-radius:var(--r-lg);overflow:hidden;border:2px solid var(--accent)}
.scan-view video{width:100%;height:100%;object-fit:cover}
.scan-overlay{position:absolute;inset:0;pointer-events:none}
.scan-overlay::before{content:'';position:absolute;left:15%;right:15%;height:2px;background:var(--accentB);animation:scanline 2s ease-in-out infinite}
@keyframes scanline{0%,100%{top:30%;opacity:.3}50%{top:70%;opacity:1}}
.scan-corner{position:absolute;width:70%;height:50%;top:25%;left:15%;border:2px solid var(--accentB);border-radius:14px}
.scan-status{text-align:center;color:var(--text2);font-size:.88rem;font-weight:700;padding:8px;min-height:24px}
.scan-status.ok{color:var(--success)}
.scan-manual{display:flex;gap:8px}
.scan-manual input{flex:1;padding:13px;background:var(--bg3);border:1.5px solid var(--border);border-radius:var(--r-md);color:var(--text);font-size:.92rem;outline:none;font-family:monospace;min-height:46px}

  messagingSenderId: "179554538147",
  appId: "1:179554538147:web:0ac2b90ed887e3704de516",
  measurementId: "G-NSDC4N5KBF"
};

const MANAGER_PIN = '2387';
const VAT_RATE = 0.16;

(function checkConfig(){
  const errs = [];
  if (!firebaseConfig.apiKey || !firebaseConfig.apiKey.startsWith('AIza')) errs.push('apiKey');
  if (!firebaseConfig.databaseURL) errs.push('databaseURL');
  if (errs.length) {
    document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>Config Missing</h2><pre>Missing: ${errs.join(', ')}</pre><button onclick="location.reload()">Retry</button></div></div>`;

let app, auth, db;

/* ============================================================
   SAFE DOM HELPERS
   ============================================================ */
function setText(id, value){const el=document.getElementById(id); if(el) el.textContent=value;}
function setHTML(id, value){const el=document.getElementById(id); if(el) el.innerHTML=value;}
function setDisplay(id, value){const el=document.getElementById(id); if(el) el.style.display=value;}
function addClass(id, cls){const el=document.getElementById(id); if(el) el.classList.add(cls);}
function removeClass(id, cls){const el=document.getElementById(id); if(el) el.classList.remove(cls);}
function toggleClass(id, cls, force){const el=document.getElementById(id); if(el) el.classList.toggle(cls, force);}
function show(id){addClass(id, 'open');}
function hide(id){removeClass(id, 'open');}

/* ============================================================
   MOBILE + STORAGE HELPERS
   ============================================================ */
function isMobileDevice(){
  const ua = navigator.userAgent || '';
  const uaMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini|Mobile|mobile|CriOS|FxiOS/i.test(ua);
  const touchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
  const smallScreen = window.innerWidth < 900;
  return [uaMobile, touchDevice, smallScreen].filter(Boolean).length >= 2;
}

/* Test if popups are usable right now (not blocked) */
function canUsePopup(){
  try {
    const w = window.open('', '_blank', 'width=1,height=1,top=0,left=0');
    if (!w || w.closed || typeof w.closed === 'undefined') return false;
    try { w.close(); } catch(e) {}
    return true;
  } catch (e) {
    return false;
  }
}

function isStorageWorking(type){
  try {
    const s = type === 'local' ? window.localStorage : window.sessionStorage;
    const k = '__test_' + Date.now();
    s.setItem(k, 'ok');
    const v = s.getItem(k);
    s.removeItem(k);
    return v === 'ok';
  } catch (e) { return false; }
}

async function pickBestPersistence(){
  if (isStorageWorking('local')) {
    try { await setPersistence(auth, browserLocalPersistence); return 'local'; } catch(e){}
  }
  if (isStorageWorking('session')) {
    try { await setPersistence(auth, browserSessionPersistence); return 'session'; } catch(e){}
  }
  try { await setPersistence(auth, inMemoryPersistence); return 'memory'; } catch(e){}
  return 'none';
}

function markAuthIntent(){
  try {
    const u = new URL(window.location.href);
    u.searchParams.set('auth_intent', '1');
    u.searchParams.set('t', Date.now().toString());
    window.history.replaceState({}, '', u.toString());
  } catch (e) {}
}
function clearAuthIntent(){
  try {
    const u = new URL(window.location.href);
    u.searchParams.delete('auth_intent');
    u.searchParams.delete('t');
    window.history.replaceState({}, '', u.toString());
  } catch (e) {}
}
function hasAuthIntent(){
  try { return new URL(window.location.href).searchParams.get('auth_intent') === '1'; }
  catch (e) { return false; }
}

try {
  app = initializeApp(firebaseConfig);
  auth = getAuth(app);
  db = getDatabase(app);
  console.log('✅ Firebase ready');
} catch (e) {
  document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>Init Failed</h2><pre>${String(e.message||e)}</pre><button onclick="location.reload()">Retry</button></div></div>`;
  throw e;
}

/* ============================================================
   REDIRECT RESULT RESOLVER — cleans up "missing initial state"
   ============================================================ */
(async () => {
  try {
    await pickBestPersistence();
    const result = await getRedirectResult(auth);
    if (result && result.user) {
      console.log('✅ Redirect resolved:', result.user.email);
      clearAuthIntent();
    } else {
      if (hasAuthIntent()) {
        console.warn('⚠️ Auth intent present but no result — clearing');
        clearAuthIntent();
        if (window.location.hash && window.location.hash.includes('firebase')) {
          window.history.replaceState({}, '', window.location.pathname + window.location.search);
        }
      }
    }
  } catch (e) {
    console.warn('[Auth] getRedirectResult error:', e.code, e.message);
    if (e.code === 'auth/argument-error' ||
        (e.message && (e.message.includes('missing initial state') ||
                       e.message.includes('sessionStorage')))) {
      console.log('🔧 Recovering from missing initial state');
      clearAuthIntent();
      if (window.location.hash) {
        window.history.replaceState({}, '', window.location.pathname + window.location.search);
      }
    }
  }
})();

/* ============================================================

/* ============================================================

   ============================================================ */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}
function money(n){const num=Number(n)||0;const fixed=num.toFixed(2);const parts=fixed.split('.');return 'KSh '+parts[0].replace(/\B(?=(\d{3})+(?!\d))/g,',')+'.'+parts[1];}
function initials(n){return (n||'?').split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();}
function iconFor(cat){return {phones:'fa-mobile-alt',laptops:'fa-laptop',audio:'fa-headphones',accessories:'fa-plug'}[cat]||'fa-box';}
function vibrate(p){if('vibrate' in navigator){try{navigator.vibrate(p);}catch(e){}}}
function timeAgo(ts){const d=Date.now()-ts;if(d<60000)return'just now';if(d<3600000)return Math.floor(d/60000)+'m';if(d<86400000)return Math.floor(d/3600000)+'h';return Math.floor(d/86400000)+'d';}

function toast(msg, type='info', duration=2400, showUndo=false){
  let c = document.querySelector('.toasts');
  if (!c) { c = document.createElement('div'); c.className = 'toasts'; document.body.appendChild(c); }
  const icons = {info:'fa-circle-info',success:'fa-circle-check',error:'fa-circle-xmark',warning:'fa-triangle-exclamation',mpesa:'fa-mobile-screen'};
  const el = document.createElement('div');
  el.className = 'toast ' + type;
  el.innerHTML = `<i class="fas ${icons[type]||icons.info}"></i><span>${esc(msg)}</span>${showUndo?'<button class="undo">Undo</button>':''}`;
  c.appendChild(el);
  if (showUndo) el.querySelector('.undo').onclick = () => { undoRemove(); el.remove(); };
  setTimeout(() => {
    el.style.opacity = '0';
    el.style.transform = 'translateY(-20px)';
    el.style.transition = '.3s';
    setTimeout(() => el.remove(), 300);
  }, duration);
}

/* ============================================================
   CART MATH
   ============================================================ */
function cartSubtotal(){return cart.reduce((s,i)=>s+i.price*i.qty,0);}
function cartTax(){return cartSubtotal()*VAT_RATE;}
function cartTotal(){return cartSubtotal()+cartTax();}
function cartCount(){return cart.reduce((s,i)=>s+i.qty,0);}

function saveCart(){
  try {
    const clean = cart.map(i=>({id:String(i.id),name:String(i.name),price:Number(i.price)||0,icon:String(i.icon||'fa-box'),qty:Math.max(1,parseInt(i.qty)||1)}));
    localStorage.setItem(CART_KEY, JSON.stringify(clean));
  } catch(e){}
}
function loadCart(){
  try {
    const raw = localStorage.getItem(CART_KEY);
    if (!raw) return;
    const parsed = JSON.parse(raw) || [];
    cart = parsed.filter(i => i && i.id != null && i.id !== '' && typeof i.name === 'string')
      .map(i=>({id:String(i.id),name:String(i.name),price:Number(i.price)||0,icon:String(i.icon||'fa-box'),qty:Math.max(1,parseInt(i.qty)||1)}));
  } catch(e){cart = [];}
}

/* 🔑 POPUP-FIRST SIGN-IN — bypasses sessionStorage wipe on mobile */
async function doGoogleSignIn(){
  await pickBestPersistence();

  const provider = new GoogleAuthProvider();
  provider.setCustomParameters({ prompt: 'select_account' });

  const popupOk = canUsePopup();
  console.log('🔐 Popup available:', popupOk);

  // PRIORITY 1: Popup — keeps everything in the same browsing context
  if (popupOk) {
    try {
      console.log('🔵 Attempting popup sign-in');
      await signInWithPopup(auth, provider);
      clearAuthIntent();
      console.log('✅ Popup sign-in succeeded');
      return;
    } catch (err) {
      console.warn('Popup error:', err.code, err.message);

      // User cancelled → don't retry
      if (err.code === 'auth/popup-closed-by-user' ||
          err.code === 'auth/cancelled-popup-request') {
        throw err;
      }

      // Popup blocked → fall back to redirect
      if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(err.code)) {
        console.log('⚠️ Popup blocked → falling back to redirect');
        markAuthIntent();
        try { await setPersistence(auth, browserSessionPersistence); } catch(e){}
        await signInWithRedirect(auth, provider);
        return;
      }

      // "missing initial state" from previous bad redirect → retry popup fresh
      if (err.code === 'auth/argument-error' ||
          (err.message && err.message.includes('missing initial state'))) {
        console.log('🔧 Clearing stale state, retrying popup');
        clearAuthIntent();
        if (window.location.hash) {
          window.history.replaceState({}, '', window.location.pathname + window.location.search);
        }
        const p2 = new GoogleAuthProvider();
        p2.setCustomParameters({ prompt: 'select_account' });
        await signInWithPopup(auth, p2);
        return;
      }

      throw err;
    }
  }

  // PRIORITY 2: Popup unavailable → redirect fallback
  console.log('📱 Popup unavailable → using redirect');
  markAuthIntent();
  try { await setPersistence(auth, browserSessionPersistence); } catch(e){}
  await signInWithRedirect(auth, provider);
}

            <div style="font-size:2.2rem;font-weight:900;color:#fff;font-variant-numeric:tabular-nums;text-shadow:0 4px 20px rgba(0,166,81,.4)" id="mpesaModalBalance">KSh 0.00</div>
            <div style="font-size:.7rem;color:var(--text3);margin-top:6px" id="mpesaModalThreshold">Low threshold: KSh 5,000</div>
          </div>
          <div class="action-grid">
            <button class="action-card mpesa" id="mpesaDepositBtn"><i class="fas fa-arrow-down"></i><div class="t">Deposit</div><div class="s">Add to float</div></button>
            <button class="action-card mpesa" id="mpesaWithdrawBtn"><i class="fas fa-arrow-up"></i><div class="t">Withdraw</div><div class="s">Move to bank</div></button>
          </div>
        </div>
      </div>
    </div>

    <div class="modal" id="mpesaTxModal">
      <div class="m-content">
        <div class="m-hdr"><h3><i class="fas fa-mobile-screen"></i> <span id="mpesaTxTitle">Float Transaction</span></h3><button class="m-close" id="closeMpesaTx"><i class="fas fa-xmark"></i></button></div>
        <div class="m-body">
          <div class="form-field"><label>Amount (KSh)</label><input id="mpesaTxAmount" type="number" step="0.01" min="0" placeholder="0.00" inputmode="decimal"></div>
          <div class="form-field"><label>Reference / Code</label><input id="mpesaTxRef" type="text" placeholder="e.g. QK12345678" autocomplete="off"></div>
          <div class="form-field"><label>Notes (optional)</label><input id="mpesaTxNotes" type="text" placeholder="Reason…"></div>
          <div class="mpesa-float-info" id="mpesaTxPreview" style="display:none"><span class="lbl">After Transaction</span><span class="val" id="mpesaTxAfter">KSh 0.00</span></div>
        </div>
        <div class="m-foot"><button class="bs" id="cancelMpesaTx">Cancel</button><button class="bmpesa" id="saveMpesaTx"><i class="fas fa-check"></i> Confirm</button></div>
      </div>
    </div>
  `;

  wireEvents();
  loadCart();
  renderProducts();
  renderCart();
  renderRecentSales();
  updateMpesaDisplay();
  updateMobileNav();
  checkNetwork();
}

/* ============================================================
   MOBILE NAV
   ============================================================ */
function switchTab(tab){
  activeTab = tab;
  const products = document.getElementById('productsPanel');
  const profile = document.getElementById('profilePage');
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === tab));

  if (products) products.classList.remove('hidden');
  if (profile) profile.classList.remove('active');

  if (tab === 'products') { closeCartSheet(); }
  else if (tab === 'cart') { openCartSheet('cart'); }
  else if (tab === 'recent') { openCartSheet('recent'); }
  else if (tab === 'profile') {
    if (products) products.classList.add('hidden');
    if (profile) profile.classList.add('active');
    closeCartSheet();
    renderProfilePage();
  }
  vibrate(10);
}

function renderProfilePage(){
  const c = document.getElementById('profileRecentCount');
  if (c) c.textContent = `${recentSales.length} transaction${recentSales.length!==1?'s':''}`;
}

function openCartSheet(tab){
  cartSheetOpen = true;
  addClass('cartSheetBackdrop', 'open');
  addClass('cartSheet', 'open');
  if (tab === 'recent') {
    switchSheetTab('recent');
    const rbtn = document.querySelector('#cartSheet .cart-tab[data-tab="recent"]');
    if (rbtn) rbtn.click();
  }
}

function closeCartSheet(){
  cartSheetOpen = false;
  removeClass('cartSheetBackdrop', 'open');
  removeClass('cartSheet', 'open');
  if (activeTab === 'cart' || activeTab === 'recent') {
    activeTab = 'products';
    document.querySelectorAll('.bnav-item').forEach(b => b.classList.toggle('active', b.dataset.nav === 'products'));
  }
}

function switchSheetTab(tab){
  document.querySelectorAll('#cartSheet .cart-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === tab));
  const cartPane = document.getElementById('sheetPaneCart');
  const recentPane = document.getElementById('sheetPaneRecent');
  if (cartPane) cartPane.style.display = tab === 'cart' ? 'flex' : 'none';
  if (recentPane) recentPane.style.display = tab === 'recent' ? 'flex' : 'none';
  if (tab === 'recent') renderRecentSales();
}

function updateMobileNav(){
  const count = cartCount();
  const bnav = document.getElementById('bnavCartBadge');
  if (bnav) {
    bnav.textContent = count;
    bnav.style.display = count > 0 ? 'block' : 'none';
  }
  const fabBadge = document.getElementById('fabBadge');
  if (fabBadge) {
    fabBadge.textContent = count;
    fabBadge.style.display = count > 0 ? 'block' : 'none';
  }
  setText('sheetCount', count);
}

/* ============================================================
   EVENTS
   ============================================================ */
function wireEvents(){
  const si = document.getElementById('searchInput');
  const sw = document.getElementById('searchWrap');
  if (si) si.oninput = e => { searchQuery = e.target.value.toLowerCase(); if (sw) sw.classList.toggle('has-text', searchQuery.length > 0); renderProducts(); };
  const clearBtn = document.getElementById('clearSearch');
  if (clearBtn) clearBtn.onclick = () => { if (si) { si.value=''; si.focus(); } searchQuery=''; if (sw) sw.classList.remove('has-text'); renderProducts(); };

  const chips = document.getElementById('chips');
  if (chips) chips.onclick = e => {
    const c = e.target.closest('.chip');
    if (!c) return;
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    c.classList.add('active');
    const fb = document.getElementById('favBtn');
    if (fb) fb.classList.remove('active');
    activeCategory = c.dataset.cat;
    renderProducts();
  };

  const favBtn = document.getElementById('favBtn');
  if (favBtn) favBtn.onclick = () => {
    const isFav = favBtn.classList.toggle('active');
    document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
    activeCategory = isFav ? 'favorites' : 'all';
    if (!isFav) { const ac = document.querySelector('.chip[data-cat="all"]'); if (ac) ac.classList.add('active'); }
    renderProducts();
  };

  document.querySelectorAll('#cartPanel .cart-tab').forEach(tab => {
    tab.onclick = () => {
      const t = tab.dataset.tab;
      document.querySelectorAll('#cartPanel .cart-tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
      document.querySelectorAll('#cartPanel .cart-pane').forEach(p => p.classList.toggle('active', p.id === 'pane-' + t));
      if (t === 'recent') renderRecentSales();
    };
  });

  document.querySelectorAll('#cartSheet .cart-tab').forEach(tab => {
    tab.onclick = () => switchSheetTab(tab.dataset.tab);
  });

  document.querySelectorAll('.bnav-item').forEach(btn => {
    btn.onclick = () => switchTab(btn.dataset.nav);
  });

  const fab = document.getElementById('cartFab');
  if (fab) fab.onclick = () => switchTab('cart');

  const sheetClose = document.getElementById('sheetClose');
  if (sheetClose) sheetClose.onclick = closeCartSheet;
  const sheetBackdrop = document.getElementById('cartSheetBackdrop');
  if (sheetBackdrop) sheetBackdrop.onclick = closeCartSheet;

  const sheetHandle = document.getElementById('sheetHandle');
  const cartSheet = document.getElementById('cartSheet');
  if (sheetHandle && cartSheet) {
    let startY = 0, currentY = 0, dragging = false;
    sheetHandle.addEventListener('touchstart', e => {
      dragging = true;
      startY = e.touches[0].clientY;
      cartSheet.style.transition = 'none';
    }, {passive: true});
    sheetHandle.addEventListener('touchmove', e => {
      if (!dragging) return;
      currentY = e.touches[0].clientY;
      const diff = Math.max(0, currentY - startY);
      cartSheet.style.transform = `translateY(${diff}px)`;
    }, {passive: true});
    sheetHandle.addEventListener('touchend', () => {
      dragging = false;
      cartSheet.style.transition = '';
      cartSheet.style.transform = '';
      if (currentY - startY > 100) closeCartSheet();
      startY = currentY = 0;
    });
  }

  const scanBtn = document.getElementById('scanBtn');
  if (scanBtn) scanBtn.onclick = () => openScanner('cart');
  const closeScan = document.getElementById('closeScan');
  if (closeScan) closeScan.onclick = closeScanner;
  const manualBtn = document.getElementById('manualBtn');
  if (manualBtn) manualBtn.onclick = () => { const v = document.getElementById('manualCode'); if (v && v.value.trim()) handleScan(v.value.trim()); };
  const manualCode = document.getElementById('manualCode');
  if (manualCode) manualCode.onkeypress = e => { if (e.key === 'Enter' && e.target.value.trim()) handleScan(e.target.value.trim()); };

  const chargeBtn = document.getElementById('chargeBtn');
  if (chargeBtn) chargeBtn.onclick = openCheckout;
  const sheetChargeBtn = document.getElementById('sheetChargeBtn');
  if (sheetChargeBtn) sheetChargeBtn.onclick = openCheckout;

  const clearCartBtn = document.getElementById('clearCartBtn');
  if (clearCartBtn) clearCartBtn.onclick = clearCart;
  const sheetClearCartBtn = document.getElementById('sheetClearCartBtn');
  if (sheetClearCartBtn) sheetClearCartBtn.onclick = clearCart;

  const closeCheckout = document.getElementById('closeCheckout');
  if (closeCheckout) closeCheckout.onclick = () => hide('checkoutModal');
  const cancelCheckout = document.getElementById('cancelCheckout');
  if (cancelCheckout) cancelCheckout.onclick = () => hide('checkoutModal');
  const confirmCheckout = document.getElementById('confirmCheckout');
  if (confirmCheckout) confirmCheckout.onclick = completeSale;

  document.querySelectorAll('.pay-opt').forEach(opt => {
    opt.onclick = () => {
      document.querySelectorAll('.pay-opt').forEach(x => x.classList.remove('active'));
      opt.classList.add('active');
      selectedPayment = opt.dataset.method;
      setDisplay('cashSection', selectedPayment === 'cash' ? 'block' : 'none');
      setDisplay('mpesaSection', selectedPayment === 'mpesa' ? 'block' : 'none');
      setText('checkoutTotal', money(cartTotal()));
      updateChangeDisplay();
      updateMpesaDisplay();
    };
  });

  const quickAmounts = [50, 100, 200, 500, 1000, 2000];
  const quickCash = document.getElementById('quickCash');
  if (quickCash) {
    quickCash.innerHTML = quickAmounts.map(v => `<button data-cash="${v}">${v >= 1000 ? (v/1000)+'K' : v}</button>`).join('') + '<button data-cash="exact">Exact</button><button data-cash="clear">Clear</button>';
    quickCash.onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      vibrate(8);
      const v = b.dataset.cash;
      if (v === 'exact') cashReceived = cartTotal();
      else if (v === 'clear') cashReceived = 0;
      else cashReceived += parseFloat(v);
      const ci = document.getElementById('cashInput');
      if (ci) ci.value = cashReceived > 0 ? cashReceived : '';
      updateChangeDisplay();
    };
  }
  const cashInput = document.getElementById('cashInput');
  if (cashInput) cashInput.oninput = e => { cashReceived = parseFloat(e.target.value) || 0; updateChangeDisplay(); };

  const mpesaRefInput = document.getElementById('mpesaRefInput');
  if (mpesaRefInput) mpesaRefInput.oninput = e => { mpesaRef = e.target.value.trim(); };
  const mpesaPhoneInput = document.getElementById('mpesaPhoneInput');
  if (mpesaPhoneInput) mpesaPhoneInput.oninput = e => { mpesaPhone = e.target.value.trim(); };

  const closeReceipt = document.getElementById('closeReceipt');
  if (closeReceipt) closeReceipt.onclick = () => hide('receiptModal');
  const newSaleBtn = document.getElementById('newSaleBtn');
  if (newSaleBtn) newSaleBtn.onclick = () => hide('receiptModal');
  const printBtn = document.getElementById('printBtn');
  if (printBtn) printBtn.onclick = () => window.print();

  const closeMenu = document.getElementById('closeMenu');
  if (closeMenu) closeMenu.onclick = () => hide('menuModal');

  const closeEdit = document.getElementById('closeEdit');
  if (closeEdit) closeEdit.onclick = () => hide('editModal');
  const cancelEdit = document.getElementById('cancelEdit');
  if (cancelEdit) cancelEdit.onclick = () => hide('editModal');
  const saveEdit = document.getElementById('saveEdit');
  if (saveEdit) saveEdit.onclick = saveProductEdit;

  const closeStock = document.getElementById('closeStock');
  if (closeStock) closeStock.onclick = () => hide('stockModal');
  const stockAmount = document.getElementById('stockAmount');
  if (stockAmount) stockAmount.oninput = updateStockPreview;
  const stockAdd = document.getElementById('stockAdd');
  if (stockAdd) stockAdd.onclick = () => changeStock(1);
  const stockRemove = document.getElementById('stockRemove');
  if (stockRemove) stockRemove.onclick = () => changeStock(-1);

  const closePin = document.getElementById('closePin');
  if (closePin) closePin.onclick = () => { hide('pinModal'); pinCallback = null; pinBuffer = ''; };
  const pad = document.getElementById('pinPad');
  if (pad) {
    pad.innerHTML = [1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k => k === '' ? '<div></div>' : `<button class="pin-key ${k === '⌫' ? 'danger' : ''}" data-pin="${k}">${k === '⌫' ? '<i class="fas fa-delete-left"></i>' : k}</button>`).join('');
    pad.onclick = e => { const b = e.target.closest('button'); if (b) handlePinInput(b.dataset.pin); };
  }

  const profileMpesaBtn = document.getElementById('profileMpesaBtn');
  if (profileMpesaBtn) profileMpesaBtn.onclick = () => { updateMpesaDisplay(); show('mpesaModal'); };
  const profileRecentBtn = document.getElementById('profileRecentBtn');
  if (profileRecentBtn) profileRecentBtn.onclick = () => { switchTab('recent'); };
  const profileSignOutBtn = document.getElementById('profileSignOutBtn');
  if (profileSignOutBtn) profileSignOutBtn.onclick = () => signOut(auth);

  const mpesaBtn = document.getElementById('mpesaBtn');
  if (mpesaBtn) mpesaBtn.onclick = () => { updateMpesaDisplay(); show('mpesaModal'); };
  const closeMpesa = document.getElementById('closeMpesa');
  if (closeMpesa) closeMpesa.onclick = () => hide('mpesaModal');
  const mpesaDepositBtn = document.getElementById('mpesaDepositBtn');
  if (mpesaDepositBtn) mpesaDepositBtn.onclick = () => openMpesaTxModal('in');
  const mpesaWithdrawBtn = document.getElementById('mpesaWithdrawBtn');
  if (mpesaWithdrawBtn) mpesaWithdrawBtn.onclick = () => openMpesaTxModal('out');
  const closeMpesaTx = document.getElementById('closeMpesaTx');
  if (closeMpesaTx) closeMpesaTx.onclick = () => hide('mpesaTxModal');
  const cancelMpesaTx = document.getElementById('cancelMpesaTx');
  if (cancelMpesaTx) cancelMpesaTx.onclick = () => hide('mpesaTxModal');
  const saveMpesaTx = document.getElementById('saveMpesaTx');
  if (saveMpesaTx) saveMpesaTx.onclick = saveMpesaTxFn;
  const mpesaTxAmount = document.getElementById('mpesaTxAmount');
  if (mpesaTxAmount) mpesaTxAmount.oninput = updateMpesaTxPreview;

  document.querySelectorAll('.modal').forEach(m => m.addEventListener('click', e => { if (e.target === m) m.classList.remove('open'); }));

  window.addEventListener('online', checkNetwork);
  window.addEventListener('offline', checkNetwork);
}

function clearCart(){
  if (cart.length === 0) return;
  if (!confirm('Clear the entire cart?')) return;
  cart = [];
  saveCart();
  renderCart();
  renderProducts();
  toast('Cart cleared', 'info');
}

/* ============================================================
   PRODUCTS
   ============================================================ */
function renderProducts(){
  const grid = document.getElementById('grid');
  if (!grid) return;
  let list = allProducts.slice();
  if (activeCategory === 'favorites') list = list.filter(p => favorites.includes(p.id));
  else if (activeCategory !== 'all') list = list.filter(p => p.category === activeCategory);
  if (searchQuery) list = list.filter(p => (p.name||'').toLowerCase().includes(searchQuery) || (p.barcode||'').includes(searchQuery) || (p.category||'').toLowerCase().includes(searchQuery));

  if (list.length === 0) { grid.innerHTML = `<div class="empty"><i class="fas fa-box-open"></i><p>No products found</p></div>`; return; }
  if (activeCategory === 'all' && !searchQuery) list.sort((a,b) => (favorites.includes(b.id)?1:0) - (favorites.includes(a.id)?1:0));

  grid.innerHTML = list.map(p => {
    const stock = p.stock ?? 0;
    const oos = stock <= 0 && p.stock !== undefined;
    const low = stock > 0 && stock <= 5;
    const inCart = cart.find(i => String(i.id) === String(p.id));
    const fav = favorites.includes(p.id);
    return `
      <div class="card ${oos?'oos':''} ${fav?'fav':''}" data-id="${esc(p.id)}">
        ${inCart ? `<div class="card-badge">${inCart.qty}</div>` : ''}
        <button class="card-menu" data-menu="${esc(p.id)}"><i class="fas fa-ellipsis-vertical"></i></button>
        <div class="card-icon"><i class="fas ${esc(p.icon || 'fa-box')}"></i></div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-price">${money(p.price)}</div>
        <div class="card-stock ${oos?'out':low?'low':''}">${p.stock !== undefined ? stock + ' in stock' : ''}</div>
      </div>`;
  }).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.onclick = e => {
      if (e.target.closest('.card-menu')) return;
      const p = allProducts.find(x => String(x.id) === String(card.dataset.id));
      if (p) addToCart(p);
    };
    let pressTimer;
    const startPress = () => { pressTimer = setTimeout(() => { vibrate(30); toggleFavorite(card.dataset.id); }, 600); };
    const cancelPress = () => clearTimeout(pressTimer);
    card.addEventListener('touchstart', startPress, {passive:true});
    card.addEventListener('touchend', cancelPress, {passive:true});
    card.addEventListener('touchmove', cancelPress, {passive:true});
    card.addEventListener('mousedown', startPress);
    card.addEventListener('mouseup', cancelPress);
    card.addEventListener('mouseleave', cancelPress);
  });
  grid.querySelectorAll('.card-menu').forEach(btn => btn.onclick = e => { e.stopPropagation(); openProductMenu(btn.dataset.menu); });
}

function toggleFavorite(id){
  const i = favorites.indexOf(id);
  if (i >= 0) { favorites.splice(i,1); toast('Removed from favorites', 'info'); }
  else { favorites.push(id); toast('Added to favorites', 'success'); }
  try { localStorage.setItem(FAV_KEY, JSON.stringify(favorites)); } catch(e){}
  renderProducts();
}

function openProductMenu(id){
  const p = allProducts.find(x => String(x.id) === String(id));
  if (!p) return;
  activeProductMenu = p;
  const body = document.getElementById('menuBody');
  if (!body) return;
  body.innerHTML = `
    <div style="text-align:center;padding:6px 0 12px">
      <div style="font-size:1rem;font-weight:800">${esc(p.name)}</div>
      <div style="font-size:.78rem;color:var(--text3);margin-top:2px">${esc(p.category||'—')} · Stock: ${p.stock??0}</div>
      ${p.barcode ? `<div style="font-family:monospace;font-size:.72rem;color:var(--text3);margin-top:4px">${esc(p.barcode)}</div>` : ''}
    </div>
    <div class="action-grid">
      <button class="action-card" data-act="edit"><i class="fas fa-pen"></i><div class="t">Edit Details</div><div class="s">Name, price, category</div></button>
      <button class="action-card" data-act="stock"><i class="fas fa-boxes-packing"></i><div class="t">Adjust Stock</div><div class="s">Add or remove units</div></button>
      <button class="action-card" data-act="barcode"><i class="fas fa-barcode"></i><div class="t">Change Barcode</div><div class="s">Scan or type new</div></button>
      <button class="action-card" data-act="favorite"><i class="fas fa-star" style="color:${favorites.includes(p.id)?'var(--warning)':'var(--accentB)'}"></i><div class="t">${favorites.includes(p.id)?'Unfavorite':'Favorite'}</div><div class="s">Pin to top</div></button>
      <button class="action-card danger" data-act="delete" style="grid-column:1/-1"><i class="fas fa-trash"></i><div class="t">Delete Product</div><div class="s">Remove from catalog</div></button>
    </div>`;
  body.querySelectorAll('[data-act]').forEach(btn => {
    btn.onclick = () => { const act = btn.dataset.act; hide('menuModal'); setTimeout(() => runProductAction(act), 150); };
  });
  show('menuModal');
}

function runProductAction(action){
  const p = activeProductMenu;
  if (!p) return;
  const needsPin = ['edit','stock','barcode','delete'].includes(action);
  if (!needsPin) { if (action === 'favorite') toggleFavorite(p.id); return; }
  requestPin(`Enter PIN to ${action} "${p.name}"`, () => {
    if (action === 'edit') openEditProduct(p);
    else if (action === 'stock') openStockAdjust(p);
    else if (action === 'barcode') openScanner('barcode-assign');
    else if (action === 'delete') deleteProduct(p);
  });
}

function openEditProduct(p){
  const n = document.getElementById('editName'); if (n) n.value = p.name || '';
  const pr = document.getElementById('editPrice'); if (pr) pr.value = p.price || 0;
  const c = document.getElementById('editCat'); if (c) c.value = p.category || 'accessories';
  const b = document.getElementById('editBarcode'); if (b) b.value = p.barcode || '';
  show('editModal');
}

async function saveProductEdit(){
  const p = activeProductMenu;
  if (!p) return;
  const name = (document.getElementById('editName')?.value || '').trim();
  const price = parseFloat(document.getElementById('editPrice')?.value);
  const category = document.getElementById('editCat')?.value || 'accessories';
  const barcode = (document.getElementById('editBarcode')?.value || '').trim();
  if (!name || isNaN(price) || price <= 0) { toast('Enter valid name and price', 'warning'); return; }
  try {
    await update(ref(db, `products/${p.id}`), { name: String(name), price: +price.toFixed(2), category: String(category), icon: iconFor(category), barcode: String(barcode) });
    hide('editModal');
    toast('Product updated', 'success');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

function openStockAdjust(p){
  setText('stockName', p.name);
  setText('stockCurrent', p.stock ?? 0);
  const amt = document.getElementById('stockAmount'); if (amt) amt.value = 1;
  updateStockPreview();
  show('stockModal');
}
function updateStockPreview(){
  const p = activeProductMenu;
  if (!p) return;
  const current = p.stock ?? 0;
  const amtEl = document.getElementById('stockAmount');
  const amt = parseInt(amtEl?.value) || 0;
  setText('stockAfter', current + amt);
}
async function changeStock(direction){
  const p = activeProductMenu;
  if (!p) return;
  const amtEl = document.getElementById('stockAmount');
  const amt = parseInt(amtEl?.value) || 0;
  if (amt <= 0) { toast('Enter valid amount', 'warning'); return; }
  const change = direction * amt;
  const newStock = Math.max(0, (p.stock || 0) + change);
  try {
    const histKey = push(ref(db, `products/${p.id}/stockHistory`)).key;
    await update(ref(db, `products/${p.id}`), { stock: newStock, [`stockHistory/${histKey}`]: { change: Number(change), after: Number(newStock), by: String(currentUser.name || 'Staff'), timestamp: Date.now() } });
    toast('Stock updated → ' + newStock, 'success');
    hide('stockModal');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
}

async function deleteProduct(p){
  if (!confirm(`Delete "${p.name}"?\n\nCannot be undone.`)) return;
  try { await remove(ref(db, `products/${p.id}`)); toast('Product deleted', 'success'); }
  catch (e) { toast('Delete failed: ' + e.message, 'error'); }
}

function requestPin(msg, cb){
  pinBuffer = '';
  pinCallback = cb;
  setText('pinMsg', msg);
  setText('pinErr', '');
  document.querySelectorAll('#pinDots .pin-dot').forEach(d => { d.style.background = 'var(--bg3)'; d.style.borderColor = 'var(--border)'; });
  show('pinModal');
}
function handlePinInput(k){
  if (k === '⌫') pinBuffer = pinBuffer.slice(0, -1);
  else if (pinBuffer.length < 4) pinBuffer += k;
  document.querySelectorAll('#pinDots .pin-dot').forEach((d, i) => {
    const filled = i < pinBuffer.length;
    d.style.background = filled ? 'var(--accent)' : 'var(--bg3)';
    d.style.borderColor = filled ? 'var(--accent)' : 'var(--border)';
  });
  if (pinBuffer.length === 4) {
    setTimeout(() => {
      if (pinBuffer === MANAGER_PIN) {
        hide('pinModal');
        const cb = pinCallback;
        pinCallback = null;
        pinBuffer = '';
        if (cb) cb();
      } else {
        setText('pinErr', 'Incorrect PIN');
        vibrate([40,30,40]);
        pinBuffer = '';
        document.querySelectorAll('#pinDots .pin-dot').forEach(d => { d.style.background = 'var(--bg3)'; d.style.borderColor = 'var(--border)'; });
      }
    }, 120);
  }
}

function addToCart(p){
  if (!p || p.id == null || p.id === '') { toast('Invalid product', 'error'); return; }
  if (p.stock !== undefined && p.stock <= 0) { toast('Out of stock', 'warning'); vibrate([40,30,40]); return; }
  const existing = cart.find(i => String(i.id) === String(p.id));
  if (existing) {
    if (p.stock !== undefined && existing.qty >= p.stock) { toast('Not enough stock', 'warning'); vibrate([40,30,40]); return; }
    existing.qty += 1;
  } else {
    cart.push({ id: String(p.id), name: String(p.name || 'Unknown'), price: Number(p.price) || 0, icon: String(p.icon || 'fa-box'), qty: 1 });
  }
  vibrate(12);
  saveCart();
  renderCart();
  renderProducts();
  const fab = document.getElementById('cartFab');
  if (fab) { fab.classList.remove('pulse'); void fab.offsetWidth; fab.classList.add('pulse'); }
}

function changeQty(id, delta){
  const item = cart.find(i => String(i.id) === String(id));
  if (!item) return;
  item.qty += delta;
  if (item.qty <= 0) cart = cart.filter(i => String(i.id) !== String(id));
  vibrate(8);
  saveCart();
  renderCart();
  renderProducts();
}

function removeFromCart(id){
  const item = cart.find(i => String(i.id) === String(id));
  if (!item) return;
  lastRemoved = { item: {...item}, index: cart.findIndex(i => String(i.id) === String(id)) };
  cart = cart.filter(i => String(i.id) !== String(id));
  vibrate(20);
  saveCart();
  renderCart();
  renderProducts();
  toast(`Removed "${item.name}"`, 'info', 4000, true);
}

function undoRemove(){
  if (!lastRemoved) return;
  cart.splice(lastRemoved.index, 0, lastRemoved.item);
  lastRemoved = null;
  saveCart();
  renderCart();
  renderProducts();
  toast('Restored', 'success');
}

function renderCart(){
  const cartHTML = cart.length === 0
    ? `<div class="cart-empty"><i class="fas fa-shopping-basket"></i><p>Cart is empty</p></div>`
    : cart.map(i => `
      <div class="c-item" data-id="${esc(i.id)}">
        <div class="c-icon"><i class="fas ${esc(i.icon)}"></i></div>
        <div class="c-info"><h4>${esc(i.name)}</h4><p>${money(i.price)} × ${i.qty}</p></div>
        <div class="c-actions">
          <button class="qbtn" data-dec="${esc(i.id)}">−</button>
          <span class="qval">${i.qty}</span>
          <button class="qbtn" data-inc="${esc(i.id)}">+</button>
          <button class="del-btn" data-del="${esc(i.id)}"><i class="fas fa-trash"></i></button>
        </div>
      </div>`).join('');

  ['cartItems', 'sheetCartItems'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.innerHTML = cartHTML;
      el.querySelectorAll('[data-inc]').forEach(b => b.onclick = () => changeQty(b.dataset.inc, 1));
      el.querySelectorAll('[data-dec]').forEach(b => b.onclick = () => changeQty(b.dataset.dec, -1));
      el.querySelectorAll('[data-del]').forEach(b => b.onclick = () => removeFromCart(b.dataset.del));
    }
  });

  const sub = money(cartSubtotal());
  const tax = money(cartTax());
  const tot = money(cartTotal());
  ['sumSub','sheetSumSub'].forEach(id => setText(id, sub));
  ['sumTax','sheetSumTax'].forEach(id => setText(id, tax));
  ['sumTotal','sheetSumTotal'].forEach(id => setText(id, tot));
  setText('cartTabCount', cartCount());
  updateMobileNav();
}

function renderRecentSales(){
  const html = recentSales.length === 0
    ? `<div class="cart-empty"><i class="fas fa-clock-rotate-left"></i><p>No recent sales</p></div>`
    : recentSales.slice(0, 20).map(s => {
        const itemCount = (s.items||[]).reduce((sum,i) => sum + (i.qty||1), 0);
        const when = s.timestamp ? timeAgo(s.timestamp) : 'just now';
        const payClass = s.paymentMethod === 'mpesa' ? 'mpesa' : 'cash';
        const payLabel = s.paymentMethod === 'mpesa' ? 'M-Pesa' : 'Cash';
        return `
          <div class="sale-row" data-sale="${esc(s.id)}">
            <div class="sale-icon"><i class="fas fa-receipt"></i></div>
            <div class="sale-info">
              <h4>${itemCount} item${itemCount!==1?'s':''} · ${esc(s.staff||'Staff')}</h4>
              <p>${when} · <span class="sale-pill ${payClass}">${payLabel}</span></p>
            </div>
            <div class="sale-amount">${money(s.total)}<small>${esc(s.status||'completed')}</small></div>
          </div>`;
      }).join('');

  ['recentList','sheetRecentList'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.innerHTML = html;
      el.querySelectorAll('[data-sale]').forEach(row => {
        row.onclick = () => {
          const s = recentSales.find(x => String(x.id) === String(row.dataset.sale));
          if (s) showReceipt(s);
        };
      });
    }
  });
  renderProfilePage();
}

function openCheckout(){
  if (cart.length === 0) { toast('Cart is empty', 'warning'); return; }
  selectedPayment = 'cash';
  cashReceived = 0;
  mpesaRef = '';
  mpesaPhone = '';
  document.querySelectorAll('.pay-opt').forEach(x => x.classList.toggle('active', x.dataset.method === 'cash'));
  setDisplay('cashSection', 'block');
  setDisplay('mpesaSection', 'none');
  const ci = document.getElementById('cashInput'); if (ci) ci.value = '';
  const ri = document.getElementById('mpesaRefInput'); if (ri) ri.value = '';
  const pi = document.getElementById('mpesaPhoneInput'); if (pi) pi.value = '';
  setText('checkoutTotal', money(cartTotal()));
  updateChangeDisplay();
  updateMpesaDisplay();
  closeCartSheet();
  show('checkoutModal');
}

function updateChangeDisplay(){
  setText('cashDisp', money(cashReceived));
  const total = cartTotal();
  const change = cashReceived - total;
  const box = document.getElementById('changeBox');
  const amt = document.getElementById('changeAmt');
  if (amt) amt.textContent = money(Math.abs(change));
  if (box) {
    box.classList.toggle('neg', change < 0);
    const lbl = box.querySelector('span');
    if (lbl) lbl.textContent = change < 0 ? 'Remaining' : 'Change Due';
  }
}

function updateMpesaDisplay(){
  const formatted = money(mpesaFloatBalance);
  setText('mpesaFloatDisp', formatted);
  setText('mpesaModalBalance', formatted);
  setText('mpesaModalThreshold', 'Low threshold: ' + money(mpesaFloatLowThreshold));
  const isLow = mpesaFloatBalance < mpesaFloatLowThreshold;
  const info = document.getElementById('mpesaFloatInfo');
  if (info) info.classList.toggle('warn', isLow);
  const badge = document.getElementById('mpesaBadge');
  if (badge) badge.style.display = isLow ? 'block' : 'none';
}

async function completeSale(){
  if (cart.length === 0) { toast('Cart is empty', 'warning'); return; }
  const cleanCart = cart.filter(i => i && i.id != null && String(i.id) !== '' && typeof i.name === 'string' && i.name.length > 0 && typeof i.price === 'number' && !isNaN(i.price) && typeof i.qty === 'number' && i.qty > 0);
  if (cleanCart.length === 0) {
    toast('Cart has invalid items — cleared', 'error');
    cart = []; saveCart(); renderCart(); renderProducts(); return;
  }
  cart = cleanCart;
  const total = cartTotal();
  if (selectedPayment === 'cash' && cashReceived < total) { toast('Cash received is less than total', 'warning'); vibrate([40,30,40]); return; }
  if (selectedPayment === 'mpesa') {
    if (!mpesaRef) { toast('Enter M-Pesa reference code', 'warning'); return; }
    if (mpesaFloatBalance < total) { toast(`Insufficient float. Need ${money(total - mpesaFloatBalance)} more`, 'error', 4000); vibrate([40,30,40]); return; }
  }

  const btn = document.getElementById('confirmCheckout');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…'; }

  const sale = {
    items: cart.map(i => ({ productId: String(i.id), name: String(i.name), price: Number(i.price), qty: Number(i.qty), lineTotal: +(Number(i.price) * Number(i.qty)).toFixed(2) })),
    subtotal: +cartSubtotal().toFixed(2),
    vat: +cartTax().toFixed(2),
    vatRate: VAT_RATE,
    total: +total.toFixed(2),
    currency: 'KSh',
    paymentMethod: String(selectedPayment || 'cash'),
    cashReceived: selectedPayment === 'cash' ? +cashReceived.toFixed(2) : null,
    change: selectedPayment === 'cash' ? +(cashReceived - total).toFixed(2) : null,
    mpesaRef: selectedPayment === 'mpesa' ? String(mpesaRef) : null,
    mpesaPhone: selectedPayment === 'mpesa' ? String(mpesaPhone || '') : null,
    staff: String(currentUser?.name || 'Staff'),
    staffId: String(currentUser?.uid || 'unknown'),
    timestamp: Date.now(),
    status: 'completed'
  };

  try {
    if (isOnline) {
      const txRef = push(ref(db, 'transactions'));
      const txId = txRef.key;
      await set(txRef, { ...sale, id: txId, timestamp: serverTimestamp() });
      for (const item of cart) {
        const p = allProducts.find(x => String(x.id) === String(item.id));
        if (p && typeof p.stock === 'number') {
          const newStock = Math.max(0, p.stock - item.qty);
          await update(ref(db, `products/${p.id}`), { stock: newStock });
        }
      }
      if (selectedPayment === 'mpesa') {
        const newBalance = mpesaFloatBalance - total;
        await set(ref(db, 'mpesaFloat/balance'), +newBalance.toFixed(2));
        await set(push(ref(db, 'mpesaFloat/transactions')), {
          type: 'sale', amount: +total.toFixed(2), reference: String(mpesaRef), phone: String(mpesaPhone || ''),
          notes: `Sale #${(txId || '').slice(-6)}`, staff: String(currentUser?.name || 'Staff'), staffId: String(currentUser?.uid || 'unknown'),
          balanceAfter: +newBalance.toFixed(2), timestamp: Date.now()
        });
        toast('M-Pesa float updated', 'mpesa');
      }
      sale.id = txId;
      recentSales.unshift(sale);
      if (recentSales.length > 50) recentSales = recentSales.slice(0, 50);
    } else {
      offlineQueue.push(sale);
      localStorage.setItem(OFFLINE_KEY, JSON.stringify(offlineQueue));
      recentSales.unshift({ ...sale, id: 'offline-' + Date.now() });
      toast('Sale queued (offline)', 'warning');
    }
    showReceipt(sale);
    cart = [];
    saveCart();
    renderCart();
    renderProducts();
    renderRecentSales();
    hide('checkoutModal');
    toast(`Sale complete — ${money(total)}`, 'success');
    vibrate([30,50,30]);
  } catch (e) {
    toast('Sale failed: ' + (e.message || 'unknown error'), 'error', 4000);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Complete'; }
  }
}

function showReceipt(sale){
  const date = sale.timestamp ? new Date(sale.timestamp).toLocaleString() : new Date().toLocaleString();
  setHTML('receiptBody', `
    <div class="receipt">
      <h2>LEMSA_ACCESSORIES</h2>
      <div class="center" style="font-size:.72rem">Electronics Shop</div>
      <div class="div"></div>
      <div class="row"><span>Date:</span><span>${date}</span></div>
      <div class="row"><span>Staff:</span><span>${esc(sale.staff)}</span></div>
      <div class="row"><span>Payment:</span><span>${esc((sale.paymentMethod||'cash').toUpperCase())}</span></div>
      ${sale.mpesaRef ? `<div class="row"><span>M-Pesa Ref:</span><span>${esc(sale.mpesaRef)}</span></div>` : ''}
      <div class="div"></div>
      <div class="row hdr"><span>Item</span><span>Total</span></div>
      <div class="div"></div>
      ${(sale.items||[]).map(i => `<div class="row"><span>${esc(i.name)}</span><span>${money(i.lineTotal || (i.price*i.qty))}</span></div><div style="font-size:.7rem;color:#444;padding-left:6px">${i.qty} × ${money(i.price)}</div>`).join('')}
      <div class="div"></div>
      <div class="row"><span>Subtotal</span><span>${money(sale.subtotal)}</span></div>
      <div class="row"><span>VAT (16%)</span><span>${money(sale.vat)}</span></div>
      <div class="row total"><span>TOTAL</span><span>${money(sale.total)}</span></div>
      ${sale.paymentMethod === 'cash' ? `<div class="div"></div><div class="row"><span>Cash</span><span>${money(sale.cashReceived)}</span></div><div class="row"><span>Change</span><span>${money(sale.change)}</span></div>` : ''}
      <div class="div"></div>
      <div class="center" style="margin-top:8px;font-weight:700">Thank you</div>
    </div>`);
  show('receiptModal');
}

function openScanner(target){
  scannerTarget = target || 'cart';
  const title = document.getElementById('scanTitle');
  if (title) {
    if (target === 'cart') title.textContent = 'Scan to Add';
    else if (target === 'barcode-assign') title.textContent = 'Scan to Assign';
  }
  show('scanModal');
  lastScannedCode = null;
  lastScannedAt = 0;
  const status = document.getElementById('scanStatus');
  if (!window.ZXing) { if (status) status.textContent = '⚠️ Scanner not loaded. Type barcode below.'; return; }
  scanner = new ZXing.BrowserMultiFormatReader();
  scannerActive = true;
  if (status) { status.textContent = 'Starting camera…'; status.classList.remove('ok'); }
  scanner.decodeFromVideoDevice(null, 'scanVideo', (result, err) => {
    if (!scannerActive) return;
    if (result) {
      const code = result.getText();
      const now = Date.now();
      if (code === lastScannedCode && (now - lastScannedAt) < 2000) return;
      lastScannedCode = code; lastScannedAt = now;
      if (status) { status.textContent = '✅ ' + code; status.classList.add('ok'); }
      vibrate(20);
      handleScan(code);
    }
  }).catch(e => {
    if (status) status.textContent = '⚠️ Camera unavailable. Type barcode below.';
  });
}

function closeScanner(){
  hide('scanModal');
  scannerActive = false;
  if (scanner) { try { scanner.reset(); } catch(e){} scanner = null; }
  const v = document.getElementById('scanVideo');
  if (v && v.srcObject) { v.srcObject.getTracks().forEach(t => t.stop()); v.srcObject = null; }
  const mc = document.getElementById('manualCode'); if (mc) mc.value = '';
}

function handleScan(code){
  if (scannerTarget === 'barcode-assign') {
    const p = activeProductMenu;
    if (!p) { closeScanner(); return; }
    update(ref(db, `products/${p.id}`), { barcode: String(code) })
      .then(() => toast('Barcode saved', 'success'))
      .catch(e => toast('Failed: ' + e.message, 'error'));
    closeScanner();
    return;
  }
  const product = allProducts.find(p => String(p.barcode) === String(code) || String(p.id) === String(code));
  if (product) { addToCart(product); toast('Added: ' + product.name, 'success'); }
  else { toast('Not found: ' + code, 'warning'); }
  closeScanner();
}

let mpesaTxMode = 'in';
function openMpesaTxModal(mode){
  mpesaTxMode = mode;
  hide('mpesaModal');
  setText('mpesaTxTitle', mode === 'in' ? 'Deposit to Float' : 'Withdraw from Float');
  const amt = document.getElementById('mpesaTxAmount'); if (amt) amt.value = '';
  const ref = document.getElementById('mpesaTxRef'); if (ref) ref.value = '';
  const notes = document.getElementById('mpesaTxNotes'); if (notes) notes.value = '';
  setDisplay('mpesaTxPreview', 'none');
  show('mpesaTxModal');
  setTimeout(() => { if (amt) amt.focus(); }, 300);
}
function updateMpesaTxPreview(){
  const amtEl = document.getElementById('mpesaTxAmount');
  const amt = parseFloat(amtEl?.value) || 0;
  const preview = document.getElementById('mpesaTxPreview');
  if (!preview) return;
  if (amt <= 0) { preview.style.display = 'none'; return; }
  preview.style.display = 'flex';
  const after = mpesaTxMode === 'in' ? mpesaFloatBalance + amt : mpesaFloatBalance - amt;
  setText('mpesaTxAfter', money(Math.max(0, after)));
}
async function saveMpesaTxFn(){
  const amt = parseFloat(document.getElementById('mpesaTxAmount')?.value);
  const ref = (document.getElementById('mpesaTxRef')?.value || '').trim();
  const notes = (document.getElementById('mpesaTxNotes')?.value || '').trim();
  if (!amt || amt <= 0) { toast('Enter valid amount', 'warning'); return; }
  if (mpesaTxMode === 'out' && amt > mpesaFloatBalance) { toast(`Insufficient float. Available: ${money(mpesaFloatBalance)}`, 'error'); return; }
  const btn = document.getElementById('saveMpesaTx');
  if (btn) { btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Processing…'; }
  try {
    const newBalance = mpesaTxMode === 'in' ? mpesaFloatBalance + amt : mpesaFloatBalance - amt;
    await runTransaction(ref(db, 'mpesaFloat/balance'), (cur) => { const c = cur || 0; return mpesaTxMode === 'in' ? c + amt : c - amt; });
    await set(push(ref(db, 'mpesaFloat/transactions')), {
      type: mpesaTxMode, amount: +amt.toFixed(2), reference: ref || '', phone: '', notes: notes || '',
      staff: String(currentUser?.name || 'Staff'), staffId: String(currentUser?.uid || 'unknown'),
      balanceAfter: +newBalance.toFixed(2), timestamp: Date.now()
    });
    toast(`${mpesaTxMode === 'in' ? 'Deposited' : 'Withdrawn'} ${money(amt)}`, 'mpesa');
    vibrate([20,40,20]);
    hide('mpesaTxModal');
  } catch (e) { toast('Failed: ' + e.message, 'error'); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = '<i class="fas fa-check"></i> Confirm'; } }
}

function checkNetwork(){
  isOnline = navigator.onLine;
  const bar = document.getElementById('offlineBar');
  if (bar) bar.classList.toggle('show', !isOnline);
  if (isOnline && offlineQueue.length > 0) syncOffline();
}
async function syncOffline(){
  const q = [...offlineQueue];
  offlineQueue = [];
  localStorage.removeItem(OFFLINE_KEY);
  let synced = 0;
  for (const sale of q) {
    try {
      const txRef = push(ref(db, 'transactions'));
      const txId = txRef.key;
      await set(txRef, { ...sale, id: txId, timestamp: serverTimestamp() });
      for (const item of (sale.items || [])) {
        const p = allProducts.find(x => String(x.id) === String(item.productId));
        if (p && typeof p.stock === 'number') {
          const newStock = Math.max(0, p.stock - item.qty);
          await update(ref(db, `products/${p.id}`), { stock: newStock });
        }
      }
      if (sale.paymentMethod === 'mpesa' && sale.mpesaRef) {
        const currentSnap = await get(ref(db, 'mpesaFloat/balance'));
        const current = currentSnap.val() || 0;
        const newBal = current - sale.total;
        await set(ref(db, 'mpesaFloat/balance'), +newBal.toFixed(2));
        await set(push(ref(db, 'mpesaFloat/transactions')), {
          type: 'sale', amount: +sale.total.toFixed(2), reference: String(sale.mpesaRef), phone: String(sale.mpesaPhone || ''),
          notes: `Offline sale #${(txId || '').slice(-6)}`, staff: String(sale.staff || 'Staff'), staffId: String(sale.staffId || 'unknown'),
          balanceAfter: +newBal.toFixed(2), timestamp: Date.now()
        });
      }
      synced++;
    } catch (e) { offlineQueue.push(sale); }
  }
  if (offlineQueue.length > 0) localStorage.setItem(OFFLINE_KEY, JSON.stringify(offlineQueue));
  else if (synced > 0) toast(`Synced ${synced} offline sale${synced !== 1 ? 's' : ''}`, 'success');
}

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    shellRendered = false;
    currentUser = null;
    renderLogin(hasAuthIntent() ? 'Sign-in was interrupted. Please tap Retry.' : '');
    return;
  }
  clearAuthIntent();

  try {
    const snap = await get(ref(db, 'users'));
    const users = snap.val() || {};
    const entry = Object.entries(users).find(([uid, u]) => u && u.email && u.email.toLowerCase().trim() === (user.email || '').toLowerCase().trim());
    if (!entry) { await signOut(auth); renderLogin(`"${user.email}" is not registered.`); return; }
    currentUser = {
      uid: user.uid, email: user.email,
      name: entry[1].name || user.displayName || user.email.split('@')[0],
      role: entry[1].role || 'staff',
      photoURL: user.photoURL || null
    };
  } catch (e) {
    currentUser = { uid: user.uid, email: user.email, name: user.displayName || user.email.split('@')[0], role: 'staff', photoURL: user.photoURL || null };
  }

  try {
    const f = localStorage.getItem(FAV_KEY);
    if (f) favorites = JSON.parse(f) || [];
    const q = localStorage.getItem(OFFLINE_KEY);
    if (q) offlineQueue = JSON.parse(q) || [];
  } catch (e) {}

  onValue(ref(db, 'products'), snap => {
    const data = snap.val() || {};
    allProducts = Object.entries(data).map(([id, val]) => ({ id, ...val }));
    if (shellRendered) { renderProducts(); renderCart(); }
  });

  onValue(ref(db, 'transactions'), snap => {
    const data = snap.val() || {};
    const all = Object.entries(data).map(([id, val]) => {
      let ts = val.timestamp;
      if (ts && typeof ts === 'object' && ts['.sv'] === 'timestamp') ts = Date.now();
      return { id, ...val, timestamp: ts || Date.now() };
    }).sort((a,b) => (b.timestamp||0) - (a.timestamp||0));
    recentSales = all.slice(0, 50);
    if (shellRendered) renderRecentSales();
  });

  onValue(ref(db, 'mpesaFloat/balance'), snap => {
    mpesaFloatBalance = snap.val() || 0;
    if (shellRendered) updateMpesaDisplay();
  });

  onValue(ref(db, 'mpesaFloat/settings'), snap => {
    const settings = snap.val() || {};
    if (settings.lowThreshold) mpesaFloatLowThreshold = settings.lowThreshold;
    if (shellRendered) updateMpesaDisplay();
  });

  if (!shellRendered) {
    shellRendered = true;
    try {
      renderUI();
      console.log('✅ UI ready');
    } catch (e) {
      console.error('Render error:', e);
      document.getElementById('app').innerHTML = `<div class="fatal"><div class="fatal-card"><h2>UI Error</h2><pre>${esc(e.message)}</pre><button onclick="location.reload()">Retry</button></div></div>`;
    }
  }

  if (isOnline && offlineQueue.length > 0) syncOffline();
});
